name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays: debt shows up even when nobody pushes (CONTRIBUTING, rule 5)
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1" # Windows consoles default to a legacy encoding; the tests use non-ASCII text

jobs:
  # scripts/check_debt.py is the one-command gate: ruff, mypy, vulture, i18n extraction, pytest with coverage floors,
  # Sphinx with warnings as errors, performance guards, and `npm audit` of every package-lock.json (SEC-08). The audit
  # runs here on every push and in the weekly run, so a new advisory turns this job red even when nobody pushed. It
  # asks the npm registry; an unreachable registry is a skip, which --ci fails (PROC-02): re-run the job. An advisory
  # that cannot be fixed is recorded with its reason in pyproject.toml (`[[tool.claudia.npm-audit-allow]]`).
  # The Python side of SEC-08: the locked environment (uv.lock, every workspace package) against the advisories of PyPI.
  # A new advisory turns this red in the weekly run too, though nobody pushed. An advisory that cannot be fixed yet is
  # named with its reason in --ignore-vuln, in this file, where a reviewer sees it.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
      - name: Export the locked requirements
        run: uv export --frozen --all-packages --no-hashes --no-emit-workspace --no-emit-project -o requirements-audit.txt
      - name: Audit them
        run: uvx pip-audit --no-deps --disable-pip -r requirements-audit.txt

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      # The typesetting tests that run the real engine skip themselves where TeX is missing. LaTeX is the user's own
      # install (D90, nothing is bundled), so only Linux has it here; the sandbox, the Windows Job Object and the
      # program lookup are tested everywhere with stand-in programs, and tests/test_typeset_sandbox_windows.py runs
      # for real on the Windows runner.
      - name: Install TeX Live and poppler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-latex-extra fonts-lmodern poppler-utils
      # Windows Defender's real-time protection (and, on hosted runners, its cloud-delivered lookup) can hold a
      # newly-written file locked for several seconds -- long enough to exhaust any reasonable in-process retry --
      # right when the journal tests rotate a file by writing a replacement next to it and renaming it into place.
      # The content looks exactly like what ransomware heuristics watch for (a file suddenly replaced by
      # high-entropy, encrypted-looking bytes), which is consistent with the lock outlasting every retry budget
      # tried so far instead of clearing after a short, genuinely transient scan. Excluding the checkout and the
      # pytest temp directory removes the lock at its source instead of guessing at how long to wait for it.
      - name: Exclude the work and temp directories from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionPath "$env:TEMP"
      # The exclusion above stopped real-time scanning from locking the journal file, but the replace still gets
      # refused every time, with nothing of ours holding it open (confirmed by a diagnostic in journal.py that
      # scans this process for an open handle on the file and finds none). That rules out a lock we could wait
      # out or exempt our own path from, and points at Controlled Folder Access: a *separate* Defender feature
      # (ransomware protection, not real-time scanning) that -ExclusionPath does not cover. It blocks an app that
      # isn't on its own allow-list from writing to a protected folder, as a flat, permanent Access Denied rather
      # than a scan that finishes and lets the write through -- which matches a failure that eleven retries over
      # several seconds never once got past. Disabling it (rather than allow-listing python.exe/uv.exe by path,
      # which would need updating whenever the toolchain's install path changes) removes that block at its source.
      - name: Disable Controlled Folder Access
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -EnableControlledFolderAccess Disabled
      - run: uv sync --locked
      # web tests/types, the layout library, the browser test and the Linux client's tests are skipped here on
      # purpose: the separate `web`, `layout`, `e2e` and `linux-client` jobs below run them for real, with Node, a
      # built web app, Chromium and GTK installed. --ci fails on any OTHER skip (PROC-02), so a check that starts skipping for some new reason is
      # caught instead of waved through. (Before "e2e greeting" was listed here, it failed this job on every OS.)
      # The coverage floors (CODE-01) are measured on Linux with TeX, where every test runs; on Windows and macOS
      # whole groups of tests skip by design, so the check skips there too -- and only there may it.
      - run: >
          uv run python scripts/check_debt.py --ci
          --allow-skip "web lint" --allow-skip "web tests" --allow-skip "web types" --allow-skip "e2e greeting"
          --allow-skip "layout types" --allow-skip "layout tests" --allow-skip "linux client tests"
          ${{ runner.os != 'Linux' && '--allow-skip coverage' || '' }}

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx nuxt prepare # vitest needs the generated .nuxt files
      - run: npm run lint
      # the unit tests, with app/lib's coverage held to the thresholds in vitest.config.ts (CODE-01)
      - run: npm run coverage
      # `nuxt typecheck`, not a bare `vue-tsc --noEmit`: web/tsconfig.json has `files: []` and only references the
      # generated projects, so the bare call checked nothing and passed with a type error in any file.
      - run: npm run typecheck

  # The layout library (D902): its types (ES2022 only, no DOM, no Node) and its tests, which fetch the starter fonts
  # (pinned by SHA-256) and read every PDF back with pdf.js.
  layout:
    name: Layout library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: layout
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: layout/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs # TypeDoc: the API documentation is generated from the source

  # Real browsers against real servers: the one Python test that starts all three apps (tests/e2e), and the scripts
  # in web/e2e that walk two people through each app. They are the only tests that see the rendered page.
  e2e:
    name: End to end (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SHOTS: ${{ github.workspace }}/shots
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Chromium for Python's and Node's Playwright
        run: |
          uv run playwright install --with-deps chromium
          (cd web && npx playwright install chromium)
      - name: Three one-app servers, each greeting with its own app
        run: uv run pytest tests/e2e
      # Until the web client asks for an app by address (its own patch after D431), each script talks to a server of
      # one app, started the old way (--model, D433) on the ports it expects.
      - name: Two people in each app, against running servers
        run: |
          mkdir -p "$SHOTS"
          uv run python -m claudia_fonts fetch "$RUNNER_TEMP/fonts"
          uv run python -m claudia_server.hyphenation fetch "$RUNNER_TEMP/hyphenation"
          port=8765
          for model in claudia_computes.model:WorkbookModel claudia_composes:TextModel claudia_creates:SlideModel; do
            uv run python -m claudia_server --no-tls --port "$port" --model "$model" --web web/.output/public \
              --dir "$RUNNER_TEMP/documents-$port" --state-dir "$RUNNER_TEMP/state-$port" \
              --fonts "$RUNNER_TEMP/fonts" --hyphenation "$RUNNER_TEMP/hyphenation" \
              >> "$RUNNER_TEMP/servers.log" 2>&1 &
            port=$((port + 1))
          done
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8767/api/health > /dev/null && break; sleep 1; done
          cd web
          URL=http://127.0.0.1:8765/ npm run e2e
          URL=http://127.0.0.1:8765/ npm run e2e:pointing
          URL=http://127.0.0.1:8765/ npm run e2e:regions
          URL=http://127.0.0.1:8765/ npm run e2e:grid-a11y
          URL=http://127.0.0.1:8765/ npm run e2e:describe
          URL=http://127.0.0.1:8766/ npm run e2e:composes
          URL=http://127.0.0.1:8766/ npm run e2e:styling
          URL=http://127.0.0.1:8766/ npm run e2e:style-delete
          URL=http://127.0.0.1:8766/ npm run e2e:print
          URL=http://127.0.0.1:8766/ npm run e2e:lists
          URL=http://127.0.0.1:8766/ npm run e2e:dock-text # paragraphs as things: a tag to a heading (D554)
          URL=http://127.0.0.1:8767/ npm run e2e:slides
          URL=http://127.0.0.1:8767/ npm run e2e:creates-styles
          URL=http://127.0.0.1:8767/ npm run e2e:print-creates
          URL=http://127.0.0.1:8767/ npm run e2e:describe-creates
          URL=http://127.0.0.1:8767/ npm run e2e:present
          URL=http://127.0.0.1:8767/ npm run e2e:dock # names, a tag in the chat, replay (D550, D551)
          npm run e2e:keys # all three servers: one key table, every menu entry, nothing to undo in a new document
          pkill -f claudia_server || true
      # These two start (and restart) a server of their own, on ports the step above has freed.
      - name: Losing the server, and the recovery key
        working-directory: web
        run: |
          npm run e2e:resilience
          npm run e2e:recovery
          npm run e2e:search
          npm run e2e:pivots
          npm run e2e:passwords
          npm run e2e:details # description and tags on the front page (D530-D532), against a sealed server of its own
      # Server settings ▸ Fonts (E3.13 f, D1041): a new administrator adds a house font (one style forbids embedding and is
      # left out), renames the collection and removes it, against a server of its own on a free port.
      - name: Server settings ▸ Fonts
        run: |
          uv run python scripts/make_admin_fonts_sample.py "$RUNNER_TEMP/house-fonts"
          uv run python -m claudia_server --no-tls --port 8768 --web web/.output/public \
            --dir "$RUNNER_TEMP/documents-8768" --state-dir "$RUNNER_TEMP/state-8768" >> "$RUNNER_TEMP/servers.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8768/api/health > /dev/null && break; sleep 1; done
          cd web && URL=http://127.0.0.1:8768/ FONTS="$RUNNER_TEMP/house-fonts" npm run e2e:admin-fonts
          pkill -f "port 8768" || true
      # The Neutralino client's window (D660), minus Neutralino itself: its built shell page and core, the real web app
      # in the frame, once built for Windows and once for macOS (a build behaves like its platform wherever it runs).
      # Starts servers of its own (8791 for --server), on ports the steps above have freed.
      - name: The Windows client's window (shell page, core, server and web app, Neutralino faked)
        run: |
          (cd clients/neutralino && npm ci && npm run build:windows)
          cd web && npm run e2e:windows-shell
      - name: The macOS client's window (the same, built for macOS)
        run: |
          (cd clients/neutralino && npm run build:macos)
          cd web && npm run e2e:macos-shell
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-screenshots
          path: shots/
          if-no-files-found: ignore

  # What the OpenDocument code writes is also opened in LibreOffice, the reference implementation (D409): the library's
  # odt, odp and ods cases and a file made from a model each are converted with `soffice` and what comes out is
  # compared (the words of an odt or odp, the value of every cell of an ods). It
  # may fail without failing the build until it has a track record, so that a LibreOffice release that reads a little
  # differently does not stop anyone's work (`continue-on-error`); read its result like any other job's.
  odf-libreoffice:
    name: OpenDocument in LibreOffice
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: LibreOffice Writer, Impress and Calc, from the distribution
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc
      - run: uv sync --locked
      - run: uv run python scripts/odf_libreoffice_check.py

  # The macOS and Windows client is one TypeScript package around Neutralino (D660). Its unit tests, which test both
  # platforms' code wherever they run, its types, its builds and its generated menu (made from the Linux client's
  # manifest) are checked on Windows itself and on Linux; its windows run in Chromium in the `e2e` job. Signing,
  # notarising, a real WKWebView and a real WebView2 still need the machines and are not covered.
  neutralino-windows:
    name: Neutralino client on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/neutralino
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/neutralino/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:windows
      - name: The generated menu matches the shared manifest
        run: uv run --no-project python tools/generate_menu.py --all --check
      - run: uv run --no-project --with pytest python -m pytest tools/tests

  neutralino-linux:
    name: Neutralino client (tests and both builds)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/neutralino
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/neutralino/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:macos
      - run: npm run build:windows

  # The Linux client runs on the distribution's Python (3.12 on Ubuntu 24.04) with GTK from the distribution, while the
  # server it starts runs on 3.14 (clients/linux/README.md, "Two interpreters"). Its end-to-end test starts the real
  # server and the built web frontend under Xvfb.
  linux-client:
    name: Linux client (Python 3.12, GTK 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: GTK 4, libadwaita, WebKitGTK and the test tools, all from the distribution
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 python3-pytest python3-jsonschema
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked # the interpreter of the server that the end-to-end test starts
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build # the web frontend that the shell shows
        working-directory: web
      - name: Tests on the distribution's Python
        working-directory: clients/linux
        run: |
          /usr/bin/python3 --version
          xvfb-run -a /usr/bin/python3 -m pytest
