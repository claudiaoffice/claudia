name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays: debt shows up even when nobody pushes (CONTRIBUTING, rule 5)
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1" # Windows consoles default to a legacy encoding; the tests use non-ASCII text

jobs:
  # scripts/check_debt.py is the one-command gate: ruff, mypy, vulture, i18n extraction, pytest with coverage floors,
  # Sphinx with warnings as errors, performance guards.
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      # The typesetting tests that run the real engine skip themselves where TeX is missing. LaTeX is the user's own
      # install (D90, nothing is bundled), so only Linux has it here; the sandbox, the Windows Job Object and the
      # program lookup are tested everywhere with stand-in programs, and tests/test_typeset_sandbox_windows.py runs
      # for real on the Windows runner.
      - name: Install TeX Live and poppler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-latex-extra fonts-lmodern poppler-utils
      # Windows Defender's real-time protection (and, on hosted runners, its cloud-delivered lookup) can hold a
      # newly-written file locked for several seconds -- long enough to exhaust any reasonable in-process retry --
      # right when the journal tests rotate a file by writing a replacement next to it and renaming it into place.
      # The content looks exactly like what ransomware heuristics watch for (a file suddenly replaced by
      # high-entropy, encrypted-looking bytes), which is consistent with the lock outlasting every retry budget
      # tried so far instead of clearing after a short, genuinely transient scan. Excluding the checkout and the
      # pytest temp directory removes the lock at its source instead of guessing at how long to wait for it.
      - name: Exclude the work and temp directories from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionPath "$env:TEMP"
      # The exclusion above stopped real-time scanning from locking the journal file, but the replace still gets
      # refused every time, with nothing of ours holding it open (confirmed by a diagnostic in journal.py that
      # scans this process for an open handle on the file and finds none). That rules out a lock we could wait
      # out or exempt our own path from, and points at Controlled Folder Access: a *separate* Defender feature
      # (ransomware protection, not real-time scanning) that -ExclusionPath does not cover. It blocks an app that
      # isn't on its own allow-list from writing to a protected folder, as a flat, permanent Access Denied rather
      # than a scan that finishes and lets the write through -- which matches a failure that eleven retries over
      # several seconds never once got past. Disabling it (rather than allow-listing python.exe/uv.exe by path,
      # which would need updating whenever the toolchain's install path changes) removes that block at its source.
      - name: Disable Controlled Folder Access
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -EnableControlledFolderAccess Disabled
      - run: uv sync --locked
      # web tests/types, the browser test and the Linux client's tests are skipped here on purpose: the separate
      # `web`, `e2e` and `linux-client` jobs below run them for real, with Node, a built web app, Chromium and GTK
      # installed. --ci fails on any OTHER skip (PROC-02), so a check that starts skipping for some new reason is
      # caught instead of waved through. (Before "e2e greeting" was listed here, it failed this job on every OS.)
      # The coverage floors (CODE-01) are measured on Linux with TeX, where every test runs; on Windows and macOS
      # whole groups of tests skip by design, so the check skips there too -- and only there may it.
      - run: >
          uv run python scripts/check_debt.py --ci
          --allow-skip "web lint" --allow-skip "web tests" --allow-skip "web types" --allow-skip "e2e greeting"
          --allow-skip "linux client tests"
          ${{ runner.os != 'Linux' && '--allow-skip coverage' || '' }}

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx nuxt prepare # vitest needs the generated .nuxt files
      - run: npm run lint
      # the unit tests, with app/lib's coverage held to the thresholds in vitest.config.ts (CODE-01)
      - run: npm run coverage
      # `nuxt typecheck`, not a bare `vue-tsc --noEmit`: web/tsconfig.json has `files: []` and only references the
      # generated projects, so the bare call checked nothing and passed with a type error in any file.
      - run: npm run typecheck

  # Real browsers against real servers: the one Python test that starts all three apps (tests/e2e), and the scripts
  # in web/e2e that walk two people through each app. They are the only tests that see the rendered page.
  e2e:
    name: End to end (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SHOTS: ${{ github.workspace }}/shots
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Chromium for Python's and Node's Playwright
        run: |
          uv run playwright install --with-deps chromium
          (cd web && npx playwright install chromium)
      - name: Three servers, each greeting with its own app
        run: uv run pytest tests/e2e
      - name: Two people in each app, against running servers
        run: |
          mkdir -p "$SHOTS"
          uv run python scripts/start.py all --dir "$RUNNER_TEMP/documents" --no-browser > "$RUNNER_TEMP/servers.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8767/api/health > /dev/null && break; sleep 1; done
          cd web
          URL=http://127.0.0.1:8765/ npm run e2e
          URL=http://127.0.0.1:8765/ npm run e2e:pointing
          URL=http://127.0.0.1:8766/ npm run e2e:composes
          URL=http://127.0.0.1:8766/ npm run e2e:styling
          URL=http://127.0.0.1:8767/ npm run e2e:slides
          pkill -f claudia_server || true
      # These two start (and restart) a server of their own, on ports the step above has freed.
      - name: Losing the server, and the recovery key
        working-directory: web
        run: |
          npm run e2e:resilience
          npm run e2e:recovery
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: shots/
          if-no-files-found: ignore

  # The Windows client is TypeScript around Neutralino; its unit tests and its generated menu (made from the Linux
  # client's manifest) are checked on Windows itself.
  windows-client:
    name: Windows client
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/windows/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: The generated menu matches the shared manifest
        run: uv run --no-project python tools/generate_menu.py --all --check
      - run: uv run --no-project --with pytest python -m pytest tools/tests

  # The Linux client runs on the distribution's Python (3.12 on Ubuntu 24.04) with GTK from the distribution, while the
  # server it starts runs on 3.14 (clients/linux/README.md, "Two interpreters"). Its end-to-end test starts the real
  # server and the built web frontend under Xvfb.
  linux-client:
    name: Linux client (Python 3.12, GTK 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: GTK 4, libadwaita, WebKitGTK and the test tools, all from the distribution
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 python3-pytest python3-jsonschema
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked # the interpreter of the server that the end-to-end test starts
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build # the web frontend that the shell shows
        working-directory: web
      - name: Tests on the distribution's Python
        working-directory: clients/linux
        run: |
          /usr/bin/python3 --version
          xvfb-run -a /usr/bin/python3 -m pytest
