# Puts the image that CI built on main into the demo on Scaleway Serverless Containers (demo.claudia-office.de).
#
# Starts by itself when "CI" has succeeded on a push to main (not when the image alone was built: the image workflow
# runs beside CI, and a red main must not replace the demo), then waits for the image of that commit, which the
# "Docker image" workflow pushes. By hand (Actions > Deploy demo > Run workflow) it can deploy any tag the image has,
# which is also the way back to an earlier version: give e.g. sha-1a2b3c4.
#
# The image is copied from GHCR to the Scaleway registry under an unchanging tag per commit, the containers are pointed
# at it and redeployed. Their settings (environment, scale, domain) are left as they are in Scaleway.
#
# Before the copy, the old tags of claudia-demo in the Scaleway registry are deleted (scripts/prune_registry.py), so it
# holds only what runs and what is about to run instead of one image per push. Rolling back does not need them: it
# copies the tag from GHCR again. If pruning fails, the deployment goes on with a warning.
#
# Set up once, in Settings > Secrets and variables > Actions, and Settings > Environments > demo:
#   secret   SCW_SECRET_KEY            API key secret of a Scaleway IAM application (rights: ContainersFullAccess,
#                                      ContainerRegistryFullAccess in the project of the demo)
#   variable SCW_REGISTRY_NAMESPACE    the Container Registry namespace, as in rg.fr-par.scw.cloud/NAMESPACE
#   variable SCW_DEMO_CONTAINER_IDS    the ids (UUIDs) of the demo containers, separated by spaces (one per app)
#   variable SCW_REGION                optional, default fr-par
#   variable DEMO_URL                  optional, default https://demo.claudia-office.de; checked after the deployment
#   variable SCW_DEMO_KEEP_TAGS        optional, default 0; how many older tags to keep in the Scaleway registry
#                                      besides the running and the new one
name: Deploy demo

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (sha-1a2b3c4, latest, 0.1.0, ...)"
        required: true
        default: latest

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A workflow_run starts for failed runs too, and for pushes of tags and pull requests of forks; only main counts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: demo
      url: ${{ vars.DEMO_URL || 'https://demo.claudia-office.de' }}
    permissions:
      contents: read
      packages: read
    env:
      SOURCE: ghcr.io/claudiaoffice/claudia-server
      REGION: ${{ vars.SCW_REGION || 'fr-par' }}
      NAMESPACE: ${{ vars.SCW_REGISTRY_NAMESPACE }}
      CONTAINER_IDS: ${{ vars.SCW_DEMO_CONTAINER_IDS }}
      DEMO_URL: ${{ vars.DEMO_URL || 'https://demo.claudia-office.de' }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      INPUT_TAG: ${{ inputs.tag }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check the settings
        run: |
          missing=
          for name in SCW_SECRET_KEY NAMESPACE CONTAINER_IDS; do
            [ -n "${!name}" ] || { echo "::error::$name is not set (see the top of .github/workflows/deploy-demo.yml)"; missing=1; }
          done
          [ -z "$missing" ] || exit 1

      - name: Which image
        id: image
        run: |
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"; else tag="sha-${HEAD_SHA:0:7}"; fi
          # The tag ends up in a command line; a registry tag is letters, digits, dot, dash and underscore.
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::'$tag' is not an image tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target=rg.${REGION}.scw.cloud/${NAMESPACE}/claudia-demo:${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/prune_registry.py
            .python-version
          sparse-checkout-cone-mode: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Delete the old tags in the Scaleway registry
        # Saves storage, but must never stop a deployment; the next run tries again.
        continue-on-error: true
        env:
          TAG: ${{ steps.image.outputs.tag }}
          KEEP_NEWEST: ${{ vars.SCW_DEMO_KEEP_TAGS || '0' }}
        run: |
          containers=()
          for id in $CONTAINER_IDS; do containers+=(--container "$id"); done
          uv run --no-project python scripts/prune_registry.py --region "$REGION" --namespace "$NAMESPACE" \
            --image claudia-demo --keep "$TAG" --keep-newest "$KEEP_NEWEST" "${containers[@]}"

      - name: Copy the image from GHCR to the Scaleway registry
        env:
          TAG: ${{ steps.image.outputs.tag }}
          TARGET: ${{ steps.image.outputs.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          echo "$SCW_SECRET_KEY" | docker login "rg.${REGION}.scw.cloud/${NAMESPACE}" -u nologin --password-stdin
          # CI may end before the image workflow of the same commit has pushed its image: wait for it, up to 20 minutes
          pulled=
          for _ in $(seq 1 40); do
            if docker pull --platform linux/amd64 "$SOURCE:$TAG"; then pulled=1; break; fi
            echo "$SOURCE:$TAG is not there yet; the Docker image workflow may still be building it"
            sleep 30
          done
          [ -n "$pulled" ] || { echo "::error::$SOURCE:$TAG did not appear in 20 minutes: did the Docker image workflow fail?"; exit 1; }
          docker tag "$SOURCE:$TAG" "$TARGET"
          docker push "$TARGET"

      - name: Deploy
        env:
          TARGET: ${{ steps.image.outputs.target }}
        run: |
          api="https://api.scaleway.com/containers/v1beta1/regions/${REGION}/containers"
          scw() {
            local out code
            out="$(mktemp)"
            code="$(curl -sS -o "$out" -w '%{http_code}' \
                -H "X-Auth-Token: $SCW_SECRET_KEY" -H "Content-Type: application/json" "$@")"
            if [ "$code" -ge 400 ]; then
              echo "::error::HTTP $code from: $*"; cat "$out" >&2; rm -f "$out"; return 1
            fi
              cat "$out"; rm -f "$out"
          }

          for id in $CONTAINER_IDS; do
            [[ "$id" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::'$id' is not a container id"; exit 1; }
            echo "::group::container $id"
            echo "status before: $(scw "$api/$id" | jq -r .status)"
            body="$(scw -X PATCH -d "{\"registry_image\": \"$TARGET\"}" "$api/$id")"
            echo "status after update: $(jq -r .status <<<"$body")"
            
            status=
            for _ in $(seq 1 60); do
              body="$(scw "$api/$id")"
              status="$(jq -r .status <<<"$body")"
              echo "status: $status"
              [ "$status" = ready ] && break
              if [ "$status" = error ]; then
                echo "::error::deployment failed: $(jq -r .error_message <<<"$body")"
                exit 1
              fi
              sleep 10
            done
            [ "$status" = ready ] || { echo "::error::container $id is '$status' after 10 minutes"; exit 1; }
            echo "::endgroup::"
          done

      - name: Check the demo answers
        run: |
          # A scaled-to-zero container needs a moment to start.
          for _ in $(seq 1 12); do
            if curl -fsS "$DEMO_URL/api/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::$DEMO_URL/api/health does not answer. If it is a 403, the host name is missing in CLAUDIA_ALLOW_HOST of the container."
          exit 1
