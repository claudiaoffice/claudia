# Builds the Debian package of the Linux client (Claudia Composes, Computes and Creates, each with its own start
# button, with their server and web app inside), installs it on a clean runner and starts every app.
#
#   pull request / push to main   build, check, install, test; the .deb is kept as a workflow artifact for 30 days
#   tag v1.2.3                    the same, and the .deb is attached to the GitHub release of the tag
#
# The package is for Ubuntu 24.04 and newer, and Debian 13 (it needs the system's GTK 4, libadwaita and WebKitGTK 6).
name: Debian package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - packaging/**
      - clients/linux/**
      - clients/contract/**
      - web/**
      - layout/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/deb.yml
  workflow_dispatch:

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Tag and version agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' clients/linux/src/claudia_shell_gtk/_version.py)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but clients/linux/src/claudia_shell_gtk/_version.py says $version"
            exit 1
          fi

      - name: Check the desktop file and the AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          for app in composes computes creates; do
            desktop-file-validate "clients/linux/apps/$app/de.claudiaoffice.$app.desktop"
            appstreamcli validate --no-net "clients/linux/apps/$app/de.claudiaoffice.$app.metainfo.xml"
          done

      - name: Build
        run: |
          # Builds that are not releases sort before the release they lead to: 0.1.0~git42.1a2b3c4
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            export DEB_VERSION_SUFFIX="~git${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:7}"
          fi
          # The server's virtual environment cannot be moved, so it is built where it will live.
          sudo install -d -o "$USER" -g "$(id -gn)" /opt/claudia
          packaging/debian/build-deb.sh dist
          ls -l dist

      - name: Install on this runner and start
        run: |
          sudo rm -rf /opt/claudia
          sudo apt-get install -y --no-install-recommends ./dist/*.deb xvfb
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' clients/linux/src/claudia_shell_gtk/_version.py)"
          port=8765
          # Every app: its start button (command, desktop entry), and the server it would start, on the Python
          # that comes with the package. (The models are those the apps name in identity.py.)
          for app in composes computes creates; do
            test -x "/usr/bin/claudia-$app"
            test -f "/usr/share/applications/de.claudiaoffice.$app.desktop"
            test -f "/usr/share/icons/hicolor/scalable/apps/de.claudiaoffice.$app.svg"
            [ "$(xvfb-run -a "claudia-$app" --version)" = "claudia-$app $version" ]
            model="$(cd clients/linux/src && python3 -c "from claudia_shell_gtk import identity; print(identity.get('$app').model)")"
            /opt/claudia/venv/bin/python -m claudia_server --model "$model" \
              --host 127.0.0.1 --port "$port" --no-tls --web /opt/claudia/web --max-documents 5 &
            pid=$!
            ok=
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:$port/api/health; then ok=1; break; fi
              sleep 1
            done
            kill "$pid"
            wait "$pid" || true
            [ -n "$ok" ]
            port=$((port + 1))
          done

      # What a person does with the installed package: start an app from its start button and use what it started. Each
      # app is a GTK window (under Xvfb here) whose shell brings its own server up, on a port of its own so that the
      # three runs do not meet the server of the one before (it stops by itself ten minutes after its window closed).
      - name: Every app opens its window, and its server serves all three apps
        env:
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1" # the runner's container has no room for WebKit's own sandbox
        run: |
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dri dbus
          server_version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' packages/claudia-server/src/claudia_server/_version.py)"
          port=8811
          for app in composes computes creates; do
            # setsid: the window is a process group of its own, so that all of it can be ended at once
            CLAUDIA_SERVER_PORT=$port setsid xvfb-run -a dbus-run-session -- "claudia-$app" > "$RUNNER_TEMP/$app.log" 2>&1 &
            window=$!
            ok=
            for _ in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null 2>&1; then ok=1; break; fi
              if ! kill -0 "$window" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ -z "$ok" ]; then
              echo "::error::claudia-$app did not bring its server up"; cat "$RUNNER_TEMP/$app.log"; exit 1
            fi
            # the window is still there, and the server it started is the one of the package (not a Python of this runner)
            kill -0 "$window"
            pgrep -af "/opt/claudia/venv/bin/python.* -m claudia_server" | grep -q -- "--port $port"
            /opt/claudia/venv/bin/python packaging/smoke_server.py "http://127.0.0.1:$port" --expect-version "$server_version"
            # The window goes first. A window whose server has gone starts it again (D445), and that server would hold the
            # suite's one folder of documents (D435) when the next app starts. Then the server is ended, and awaited until it
            # has let go of the folder.
            kill -TERM -- "-$window" 2>/dev/null || true
            wait "$window" 2>/dev/null || true
            pkill -TERM -f "claudia_server .*--port $port" || true
            for _ in $(seq 1 30); do
              pgrep -f "claudia_server" >/dev/null || break
              sleep 1
            done
            if pgrep -f "claudia_server" >/dev/null; then
              echo "::error::the server of claudia-$app did not stop"; pgrep -af "claudia_server"; exit 1
            fi
            port=$((port + 1))
          done

      - name: The package installs over itself, and comes off cleanly
        run: |
          sudo apt-get install -y --reinstall ./dist/*.deb
          test -x /usr/bin/claudia-composes
          sudo apt-get remove -y claudia-office
          for app in composes computes creates; do
            if [ -e "/usr/bin/claudia-$app" ] || [ -e "/usr/share/applications/de.claudiaoffice.$app.desktop" ]; then
              echo "::error::$app is still there after the removal"; exit 1
            fi
          done
          if dpkg -s claudia-office >/dev/null 2>&1; then echo "::error::dpkg still has the package"; exit 1; fi
          # nothing of the program is left behind (documents are in the person's home, which the package never touches)
          if [ -e /opt/claudia ]; then echo "::error::/opt/claudia is still there after the removal"; ls -R /opt/claudia | head; exit 1; fi
          if pgrep -f claudia_server >/dev/null; then echo "::error::a server is still running after the removal"; exit 1; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claudia-office-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: claudia-office-deb
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The Windows installer's and the macOS package's workflows make the release too: whichever is first, the
          # others add their files to it.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
