# Builds the server image (all three apps in one), tests that each app starts, and publishes it to GHCR.
#
#   pull request   build + smoke test only (nothing is pushed)
#   push to main   push ghcr.io/claudiaoffice/claudia-server:main, :latest and :sha-<short sha>
#   tag v1.2.3     push :1.2.3, :1.2 and :sha-<short sha>
#
# The demo deployment (deploy-demo.yml) starts when this workflow has finished on main.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - packages/**
      - web/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/claudiaoffice/claudia-server

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Claudia server
            org.opencontainers.image.description=The servers of Claudia computes, composes and creates

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: claudia-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test, one container per app
        run: |
          for app in computes composes creates; do
            echo "::group::$app"
            docker run -d --name "smoke-$app" -p 8080:8080 \
              -e CLAUDIA_APP="$app" -e CLAUDIA_DEMO=1 -e PORT=8080 claudia-server:test
            ok=
            for _ in $(seq 1 30); do
              if curl -fsS http://localhost:8080/api/health; then ok=1; break; fi
              sleep 1
            done
            if [ -z "$ok" ]; then
              docker logs "smoke-$app"
              exit 1
            fi
            echo
            curl -fsS -o /dev/null -w 'web app: %{http_code}\n' http://localhost:8080/
            docker rm -f "smoke-$app" >/dev/null
            echo "::endgroup::"
          done

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
