name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays: debt shows up even when nobody pushes (CONTRIBUTING, rule 5)
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1" # Windows consoles default to a legacy encoding; the tests use non-ASCII text

jobs:
  # scripts/check_debt.py is the one-command gate: ruff, mypy, vulture, pytest,
  # Sphinx with warnings as errors, performance guards.
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/check_debt.py

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx nuxt prepare # vitest needs the generated .nuxt files
      - run: npx vitest run
      - run: npx vue-tsc --noEmit
