[project]
name = "claudia-menus"
version = "0.1.0"
description = "The menu definition every Claudia client builds its menus from (D1643): pure data, no dependencies."
license = { text = "GPL-3.0-or-later" }
# The Linux client imports it on the Python of the distribution (3.12 on Ubuntu 24.04): never ask for a newer one.
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_menus"]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py312"
