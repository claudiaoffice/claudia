[project]
name = "claudia-windows-tools"
version = "0.1.0"
description = "Development-time Python tooling for the Windows client: generate_menu.py turns the shared Linux-client manifest (clients/linux/src/claudia_shell_gtk/manifest.py) into the JSON the TypeScript shell reads (E5.11, D159)."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
# This is a build tool, not something the shipped app runs: it only needs to run on a developer's or CI's machine.
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
addopts = "-q"

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
# claudia_shell_gtk is a real check, not an ignored import: generate_menu.py's sys.path trick at runtime is mirrored
# here so mypy follows the import into the Linux client's manifest.py instead of just trusting the dynamic import.
mypy_path = ["tools", "tools/tests", "../linux/src"]
explicit_package_bases = true
