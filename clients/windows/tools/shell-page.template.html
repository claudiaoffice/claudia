<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #fff; color: #1d1d1f; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  #status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; text-align: center; background: #fff; }
  #status[hidden] { display: none; }
  #status-title { margin: 0; font-size: 20px; font-weight: 600; }
  #status-details { margin: 0; max-width: 560px; color: #6e6e73; white-space: pre-wrap; }
  #status.error #status-title { color: #b3261e; }
  @media (prefers-color-scheme: dark) {
    body, #frame, #status { background: #1c1c1e; color: #f5f5f7; }
    #status-details { color: #98989d; }
    #status.error #status-title { color: #ff8a80; }
  }
</style>
</head>
<body>
<iframe id="frame" title="__TITLE__"></iframe>
<div id="status" role="status" aria-live="polite"><h1 id="status-title">Starting…</h1><p id="status-details"></p></div>

<!-- This page loads Neutralino's client library and NOTHING else of Neutralino's. A second script tag for
     __neutralino_globals.js would overwrite the one-time token with an empty string (D157). The library is served by
     Neutralino's own static server, which writes the NL_* globals (including the token) in front of it; that is also
     why Neutralino cannot be injected into a page it did not serve, and why the web app is shown in the frame above
     (D251). -->
<script src="js/neutralino.js"></script>
<script src="shell/shell.js"></script>
</body>
</html>
