[project]
name = "claudia-composes-io"
version = "0.0.1"
description = "claudia-composes-io"
requires-python = ">=3.14"
dependencies = ["claudia-core", "claudia-composes", "python-docx>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_composes_io"]

[tool.uv.sources]
claudia-core = { workspace = true }
claudia-composes = { workspace = true }
