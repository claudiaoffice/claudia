[project]
name = "claudia-composes-io"
dynamic = ["version"]
description = "claudia-composes-io"
requires-python = ">=3.14"
dependencies = ["claudia-core", "claudia-composes", "claudia-opc-io", "claudia-odf-io", "python-docx>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claudia_composes_io/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_composes_io"]

[tool.uv.sources]
claudia-core = { workspace = true }
claudia-composes = { workspace = true }
claudia-opc-io = { workspace = true }
claudia-odf-io = { workspace = true }
