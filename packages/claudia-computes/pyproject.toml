[project]
name = "claudia-computes"
dynamic = ["version"]
description = "claudia-computes"
requires-python = ">=3.14"
dependencies = ["claudia-core", "claudia-search"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claudia_computes/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_computes"]

[tool.uv.sources]
claudia-core = { workspace = true }
claudia-search = { workspace = true }
