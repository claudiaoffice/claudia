[project]
name = "claudia-computes"
version = "0.0.1"
description = "claudia-computes"
requires-python = ">=3.14"
dependencies = ["claudia-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_computes"]

[tool.uv.sources]
claudia-core = { workspace = true }
