[project]
name = "claudia-test-documents"
version = "0.0.1"
description = "claudia-test-documents"
requires-python = ">=3.14"
dependencies = ["claudia-composes", "claudia-composes-io", "claudia-opc-io", "Pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_test_documents"]

[tool.uv.sources]
claudia-composes = { workspace = true }
claudia-composes-io = { workspace = true }
claudia-opc-io = { workspace = true }
