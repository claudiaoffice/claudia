[project]
name = "claudia-composes"
dynamic = ["version"]
description = "claudia-composes"
requires-python = ">=3.14"
dependencies = ["claudia-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claudia_composes/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_composes"]

[tool.uv.sources]
claudia-core = { workspace = true }
