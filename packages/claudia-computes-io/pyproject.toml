[project]
name = "claudia-computes-io"
version = "0.0.1"
description = "claudia-computes-io"
requires-python = ">=3.14"
dependencies = ["claudia-core", "claudia-computes", "claudia-opc-io", "openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_computes_io"]

[tool.uv.sources]
claudia-core = { workspace = true }
claudia-computes = { workspace = true }
claudia-opc-io = { workspace = true }
