[project]
name = "claudia-creates-io"
dynamic = ["version"]
description = "claudia-creates-io"
requires-python = ">=3.14"
dependencies = ["claudia-core", "claudia-creates", "claudia-opc-io", "claudia-odf-io", "python-pptx>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claudia_creates_io/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_creates_io"]

[tool.uv.sources]
claudia-core = { workspace = true }
claudia-creates = { workspace = true }
claudia-opc-io = { workspace = true }
claudia-odf-io = { workspace = true }
