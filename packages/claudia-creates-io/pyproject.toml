[project]
name = "claudia-creates-io"
version = "0.0.1"
description = "claudia-creates-io"
requires-python = ">=3.14"
dependencies = ["claudia-core", "claudia-creates", "claudia-opc-io", "python-pptx>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_creates_io"]

[tool.uv.sources]
claudia-core = { workspace = true }
claudia-creates = { workspace = true }
claudia-opc-io = { workspace = true }
