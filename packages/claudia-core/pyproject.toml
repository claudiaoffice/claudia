[project]
name = "claudia-core"
dynamic = ["version"]
description = "claudia-core"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claudia_core/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_core"]

[tool.uv.sources]
claudia-core = { workspace = true }
