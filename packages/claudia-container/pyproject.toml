[project]
name = "claudia-container"
dynamic = ["version"]
description = "claudia-container: the encrypted document file of Claudia (E2): passwords, key slots, blocks, journal"
requires-python = ">=3.14"
dependencies = ["cryptography>=44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claudia_container/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_container"]
