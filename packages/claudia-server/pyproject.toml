[project]
name = "claudia-server"
dynamic = ["version"]
description = "claudia-server: hosts documents, authenticates people and speaks the live protocol (E3.1)"
requires-python = ">=3.14"
dependencies = ["claudia-core", "claudia-computes", "claudia-composes", "claudia-creates", "claudia-composes-io", "claudia-computes-io", "claudia-creates-io", "claudia-container", "claudia-ai", "claudia-typeset", "claudia-fonts", "claudia-search", "fastapi>=0.115", "uvicorn>=0.30", "websockets>=13", "cryptography>=44"]

[project.optional-dependencies]
openvino = ["claudia-ai[openvino]"]  # the language model of --ai

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/claudia_server/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_server"]

[tool.uv.sources]
claudia-core = { workspace = true }
claudia-search = { workspace = true }
claudia-computes = { workspace = true }
claudia-container = { workspace = true }
claudia-composes = { workspace = true }
claudia-creates = { workspace = true }
claudia-composes-io = { workspace = true }
claudia-computes-io = { workspace = true }
claudia-creates-io = { workspace = true }
claudia-ai = { workspace = true }
claudia-typeset = { workspace = true }
claudia-fonts = { workspace = true }
