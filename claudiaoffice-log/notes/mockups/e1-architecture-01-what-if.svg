<svg viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">claudia - E1 architecture 1: the what-if kernel and its server desk</title><desc id="d">Class diagram: Document starts a WhatIf, which makes a Proposal; Document applies a Proposal as one Batch or raises ProposalOutdated; the server keeps WhatIfs in a per-person WhatIfDesk.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6880"/></marker></defs>
<rect width="1400" height="760" fill="#f3f1ea"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">E1 architecture 1 — the what-if (D1308): kernel in claudia_core, desk in claudia_server</text>
<text x="40" y="66" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Plain data crosses the wire; a what-if is never a line (D48, D263). First consumer: the AI&#x27;s suggest mode (E7.8).</text>
<rect x="30" y="90" width="760" height="560" rx="10" fill="#f7f3ec" stroke="#d8d2e6" stroke-width="1"/>
<text x="44" y="112" font-size="12" font-weight="600" fill="#6e6880" text-anchor="start">claudia_core  (no I/O)</text>
<rect x="810" y="90" width="560" height="560" rx="10" fill="#f7f3ec" stroke="#d8d2e6" stroke-width="1"/>
<text x="824" y="112" font-size="12" font-weight="600" fill="#6e6880" text-anchor="start">claudia_server</text>
<rect x="40" y="680" width="26" height="12" rx="3" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="74" y="690" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">exists today</text>
<rect x="170" y="680" width="26" height="12" rx="3" fill="#fff" stroke="#d6477a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="204" y="690" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">new in E1 (dashed)</text>
<text x="350" y="690" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">bold coloured line = new member of an existing class</text>
<rect x="50" y="130" width="330" height="154" rx="6" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/>
<path d="M50 136 a6 6 0 0 1 6 -6 h318 a6 6 0 0 1 6 6 v24 h-330 z" fill="#5b4bc4"/>
<text x="215.0" y="150" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">Document</text>
<text x="62" y="181" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">scratch(at) -&gt; Document</text>
<text x="62" y="199" font-size="11.5" font-weight="600" fill="#5b4bc4" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">what_if(at, author) -&gt; WhatIf</text>
<text x="62" y="217" font-size="11.5" font-weight="600" fill="#5b4bc4" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">apply_proposal(proposal, author, via)</text>
<text x="62" y="235" font-size="11.5" font-weight="600" fill="#5b4bc4" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">-&gt; Applied   (one Batch, one undo)</text>
<text x="62" y="253" font-size="11.5" font-weight="600" fill="#5b4bc4" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">raises ProposalOutdated(conflicts)</text>
<text x="62" y="271" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">changes_since / peek_* / materialize</text>
<rect x="440" y="130" width="320" height="190" rx="6" fill="#fff" stroke="#d6477a" stroke-width="1.6" stroke-dasharray="6 4"/>
<path d="M440 136 a6 6 0 0 1 6 -6 h308 a6 6 0 0 1 6 6 v24 h-320 z" fill="#d6477a"/>
<text x="600.0" y="150" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">WhatIf</text>
<text x="452" y="181" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">base: Revision</text>
<text x="452" y="199" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">document: Document   (private copy)</text>
<text x="452" y="217" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">apply(command) -&gt; Applied</text>
<text x="452" y="235" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">undo_last()</text>
<text x="452" y="253" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">proposal() -&gt; Proposal</text>
<text x="452" y="271" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">changes() -&gt; Changes</text>
<text x="452" y="289" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">conflicts_with(live) -&gt; tuple[Region]</text>
<text x="452" y="307" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">what_if() -&gt; WhatIf   (of a what-if)</text>
<rect x="440" y="360" width="320" height="152" rx="6" fill="#fff" stroke="#d6477a" stroke-width="1.6" stroke-dasharray="6 4"/>
<path d="M440 366 a6 6 0 0 1 6 -6 h308 a6 6 0 0 1 6 6 v40 h-320 z" fill="#d6477a"/>
<text x="600.0" y="377" font-size="11" font-weight="400" fill="#fff" text-anchor="middle" font-style="italic">«frozen, plain data»</text>
<text x="600.0" y="396" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">Proposal</text>
<text x="452" y="427" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">base: Revision</text>
<text x="452" y="445" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">commands: tuple[Command]</text>
<text x="452" y="463" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">footprint: tuple[Region]</text>
<text x="452" y="481" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">author: str</text>
<text x="452" y="499" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">to_data() / from_data()</text>
<rect x="50" y="360" width="330" height="134" rx="6" fill="#fff" stroke="#d6477a" stroke-width="1.6" stroke-dasharray="6 4"/>
<path d="M50 366 a6 6 0 0 1 6 -6 h318 a6 6 0 0 1 6 6 v40 h-330 z" fill="#d6477a"/>
<text x="215.0" y="377" font-size="11" font-weight="400" fill="#fff" text-anchor="middle" font-style="italic">«error»</text>
<text x="215.0" y="396" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">ProposalOutdated</text>
<text x="62" y="427" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">conflicts: tuple[Region]</text>
<text x="62" y="445" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace"># overlap (Region.overlaps, E1.5)</text>
<text x="62" y="463" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace"># or a structural command in the</text>
<text x="62" y="481" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">#   same container (D263 rule 1)</text>
<rect x="50" y="520" width="330" height="100" rx="6" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/>
<path d="M50 526 a6 6 0 0 1 6 -6 h318 a6 6 0 0 1 6 6 v24 h-330 z" fill="#5b4bc4"/>
<text x="215.0" y="540" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">Entry  (log line)</text>
<text x="62" y="571" font-size="11.5" font-weight="600" fill="#5b4bc4" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">via: str | None      # &#x27;ai&#x27;, ...</text>
<text x="62" y="589" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">  set by apply_proposal(via=…)</text>
<text x="62" y="607" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">revision, author, command, ...</text>
<line x1="380" y1="160" x2="440" y2="160" stroke="#6e6880" stroke-width="1.4" marker-end="url(#ar)"/>
