<text x="608" y="344" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">makes</text>
<line x1="215" y1="284" x2="215" y2="360" stroke="#6e6880" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="225" y="332" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">raises</text>
<line x1="440" y1="395" x2="380" y2="262" stroke="#6e6880" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="300" y="318" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">applied by</text>
<rect x="840" y="130" width="500" height="172" rx="6" fill="#fff" stroke="#d6477a" stroke-width="1.6" stroke-dasharray="6 4"/>
<path d="M840 136 a6 6 0 0 1 6 -6 h488 a6 6 0 0 1 6 6 v24 h-500 z" fill="#d6477a"/>
<text x="1090.0" y="150" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">WhatIfDesk  (one per hosted document)</text>
<text x="852" y="181" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">token -&gt; WhatIf, private to its person</text>
<text x="852" y="199" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">limits: 3 per person, 12 per document,</text>
<text x="852" y="217" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">  dropped after 15 min idle / on leave / on close</text>
<text x="852" y="235" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">start(person, at) -&gt; token</text>
<text x="852" y="253" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">as_what_if(token, method, params)</text>
<text x="852" y="271" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">apply(token, method, params)   # the app&#x27;s OWN write</text>
<text x="852" y="289" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">changes(token) / commit(token) / drop(token)</text>
<rect x="840" y="360" width="500" height="154" rx="6" fill="#fff" stroke="#d6477a" stroke-width="1.6" stroke-dasharray="6 4"/>
<path d="M840 366 a6 6 0 0 1 6 -6 h488 a6 6 0 0 1 6 6 v24 h-500 z" fill="#d6477a"/>
<text x="1090.0" y="380" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">wire methods  (versioned API, v1)</text>
<text x="852" y="411" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">what_if_start(at?)</text>
<text x="852" y="429" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">what_if_apply(token, method, params)</text>
<text x="852" y="447" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">what_if_changes(token)</text>
<text x="852" y="465" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">what_if_commit(token) -&gt; apply_proposal</text>
<text x="852" y="483" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">what_if_drop(token)</text>
<text x="852" y="501" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace"># a conflict is answered with a sentence + places</text>
<rect x="840" y="540" width="500" height="82" rx="6" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/>
<path d="M840 546 a6 6 0 0 1 6 -6 h488 a6 6 0 0 1 6 6 v24 h-500 z" fill="#5b4bc4"/>
<text x="1090.0" y="560" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">as_of / as_planned   (stay as they are)</text>
<text x="852" y="591" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">read-only, keyed by revision / plan token</text>
<text x="852" y="609" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">VIEW_READS allow-list is shared with as_what_if</text>
<line x1="1090" y1="328" x2="1090" y2="360" stroke="#6e6880" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="1090" y1="494" x2="1090" y2="540" stroke="#6e6880" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="1100" y="524" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">same read allow-list</text>
<line x1="840" y1="200" x2="760" y2="200" stroke="#6e6880" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="782" y="192" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">holds</text>
<text x="40" y="722" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">Why here: the kernel owns state and commands (claudia_core); the desk owns who may see/keep one (claudia_server, as replay.py and planned.py already do).</text>
</svg>
