<svg viewBox="0 0 1500 860" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">claudia - E7.2 architecture 2: what the model is told, in what order, and which recipes it gets</title><desc id="d">Layered system message: identity, persona, context, how to ask, look requests, change requests, skills; then which recipes of computes an editor, a viewer and a person in suggest mode are given.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6880"/></marker><marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#fff" stroke="#6e6880" stroke-width="1.2"/></marker></defs>
<rect width="1500" height="860" fill="#f3f1ea"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">E7.2 architecture 2 — what the model is told: the persona first, the recipes last, only those it can use</text>
<text x="40" y="66" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start" >One system message built by Agent.messages. Dashed = new, coloured = changed. A recipe is given only if every request it uses is offered to this asker.</text>
<rect x="30" y="90" width="760" height="710" rx="10" fill="#f7f3ec" stroke="#d8d2e6" stroke-width="1"/>
<text x="44" y="112" font-size="12" font-weight="600" fill="#6e6880" text-anchor="start" >the system message, top to bottom (same for every provider)</text>
<rect x="50" y="118" width="720" height="76" rx="8" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/>
<rect x="50" y="118" width="38" height="76" rx="8" fill="#5b4bc4" stroke="#5b4bc4" stroke-width="1"/>
<text x="69" y="162" font-size="16" font-weight="600" fill="#fff" text-anchor="middle" >1</text>
<text x="104" y="142" font-size="14" font-weight="600" fill="#1f1a33" text-anchor="start" >Identity</text>
<text x="187.2" y="142" font-size="11.5" font-weight="600" fill="#d6477a" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">SYSTEM_PROMPT</text>
<text x="104" y="164" font-size="12" font-weight="400" fill="#1f1a33" text-anchor="start" >You are "ai", an assistant working inside a shared document…</text>
<text x="104" y="182" font-size="11.5" font-weight="400" fill="#d6477a" text-anchor="start" >keeps only who it is; “answer briefly, in the language spoken to” moves into the persona</text>
<rect x="50" y="204" width="720" height="76" rx="8" fill="#fff" stroke="#d6477a" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="50" y="204" width="38" height="76" rx="8" fill="#d6477a" stroke="#d6477a" stroke-width="1"/>
<text x="69" y="248" font-size="16" font-weight="600" fill="#fff" text-anchor="middle" >2</text>
<text x="104" y="228" font-size="14" font-weight="600" fill="#1f1a33" text-anchor="start" >Persona</text>
<text x="178.8" y="228" font-size="11.5" font-weight="600" fill="#d6477a" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">persona.md of the app</text>
<text x="104" y="250" font-size="12" font-weight="400" fill="#1f1a33" text-anchor="start" >tone · brevity · the asker's language · never invent · ask when unclear · help first</text>
<text x="104" y="268" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start" >≈ 1,000 characters</text>
<rect x="50" y="290" width="720" height="76" rx="8" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/>
<rect x="50" y="290" width="38" height="76" rx="8" fill="#5b4bc4" stroke="#5b4bc4" stroke-width="1"/>
<text x="69" y="334" font-size="16" font-weight="600" fill="#fff" text-anchor="middle" >3</text>
<text x="104" y="314" font-size="14" font-weight="600" fill="#1f1a33" text-anchor="start" >Context</text>
<text x="178.8" y="314" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">lens.orient(document, …)</text>
<text x="104" y="336" font-size="12" font-weight="400" fill="#1f1a33" text-anchor="start" >sheets and their size · how cells are named · what the asker is looking at</text>
<text x="104" y="354" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start" >unchanged</text>
<rect x="50" y="376" width="720" height="76" rx="8" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/>
<rect x="50" y="376" width="38" height="76" rx="8" fill="#5b4bc4" stroke="#5b4bc4" stroke-width="1"/>
<text x="69" y="420" font-size="16" font-weight="600" fill="#fff" text-anchor="middle" >4</text>
<text x="104" y="400" font-size="14" font-weight="600" fill="#1f1a33" text-anchor="start" >How to ask</text>
<text x="204.0" y="400" font-size="11.5" font-weight="600" fill="#d6477a" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">HOW_TO_ASK</text>
<text x="104" y="422" font-size="12" font-weight="400" fill="#1f1a33" text-anchor="start" >end the answer with a ```commands block: a JSON list of requests</text>
<text x="104" y="440" font-size="11.5" font-weight="400" fill="#d6477a" text-anchor="start" >single braces (CODE-81): the model now sees {…} not {{…}}</text>
<rect x="50" y="462" width="720" height="76" rx="8" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/>
<rect x="50" y="462" width="38" height="76" rx="8" fill="#5b4bc4" stroke="#5b4bc4" stroke-width="1"/>
<text x="69" y="506" font-size="16" font-weight="600" fill="#fff" text-anchor="middle" >5</text>
<text x="104" y="486" font-size="14" font-weight="600" fill="#1f1a33" text-anchor="start" >Look requests</text>
<text x="229.2" y="486" font-size="11.5" font-weight="600" fill="#d6477a" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">tools of kind “look”</text>
<text x="104" y="508" font-size="12" font-weight="400" fill="#1f1a33" text-anchor="start" >sheets, cells, functions … and help_search, help_topic</text>
<text x="104" y="526" font-size="11.5" font-weight="400" fill="#d6477a" text-anchor="start" >help is now a look request in all three apps</text>
<rect x="50" y="548" width="720" height="76" rx="8" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/>
<rect x="50" y="548" width="38" height="76" rx="8" fill="#5b4bc4" stroke="#5b4bc4" stroke-width="1"/>
<text x="69" y="592" font-size="16" font-weight="600" fill="#fff" text-anchor="middle" >6</text>
<text x="104" y="572" font-size="14" font-weight="600" fill="#1f1a33" text-anchor="start" >Change requests</text>
<text x="246.0" y="572" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">tools of kind “change”</text>
<text x="104" y="594" font-size="12" font-weight="400" fill="#1f1a33" text-anchor="start" >set_cells, add_sheet … (only what this asker may write)</text>
<text x="104" y="612" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start" >none for a viewer or a replay</text>
<rect x="50" y="634" width="720" height="76" rx="8" fill="#fff" stroke="#d6477a" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="50" y="634" width="38" height="76" rx="8" fill="#d6477a" stroke="#d6477a" stroke-width="1"/>
<text x="69" y="678" font-size="16" font-weight="600" fill="#fff" text-anchor="middle" >7</text>
<text x="104" y="658" font-size="14" font-weight="600" fill="#1f1a33" text-anchor="start" >Skills</text>
<text x="170.4" y="658" font-size="11.5" font-weight="600" fill="#d6477a" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">skills_for(offered)</text>
<text x="104" y="680" font-size="12" font-weight="400" fill="#1f1a33" text-anchor="start" >recipes with a worked example, those whose requests are offered</text>
<text x="104" y="698" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start" >persona + all recipes ≤ 6,000 characters per app (a test)</text>
<text x="50" y="734" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start" >then: the earlier chat of this person · her question · the rounds of this question so far (exchange)</text>
<rect x="810" y="90" width="660" height="340" rx="10" fill="#f7f3ec" stroke="#d8d2e6" stroke-width="1"/>
<text x="824" y="112" font-size="12" font-weight="600" fill="#6e6880" text-anchor="start" >which recipes of computes a person gets (assumed examples)</text>
<text x="830" y="134" font-size="12" font-weight="600" fill="#6e6880" text-anchor="start" >Recipe</text>
<text x="1040" y="134" font-size="12" font-weight="600" fill="#6e6880" text-anchor="start" >Uses</text>
<text x="1250" y="134" font-size="12" font-weight="600" fill="#6e6880" text-anchor="start" >editor, act</text>
<text x="1350" y="134" font-size="12" font-weight="600" fill="#6e6880" text-anchor="start" >viewer</text>
<line x1="830" y1="144" x2="1450" y2="144" stroke="#d8d2e6"/>
<text x="830" y="168" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start" >Write values and formulas</text>
<text x="1040" y="168" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">set_cells</text>
<text x="1250" y="168" font-size="14" font-weight="600" fill="#5b4bc4" text-anchor="start" >✓</text>
<text x="1350" y="168" font-size="14" font-weight="600" fill="#6e6880" text-anchor="start" >–</text>
<text x="830" y="198" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start" >Add a sheet</text>
<text x="1040" y="198" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">add_sheet</text>
<text x="1250" y="198" font-size="14" font-weight="600" fill="#5b4bc4" text-anchor="start" >✓</text>
<text x="1350" y="198" font-size="14" font-weight="600" fill="#6e6880" text-anchor="start" >–</text>
<text x="830" y="228" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start" >Find and replace</text>
<text x="1040" y="228" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">search_replace</text>
<text x="1250" y="228" font-size="14" font-weight="600" fill="#5b4bc4" text-anchor="start" >✓</text>
<text x="1350" y="228" font-size="14" font-weight="600" fill="#6e6880" text-anchor="start" >–</text>
<text x="830" y="268" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start" >In suggest mode, computes and creates may write nothing (SUGGEST_METHODS), so their</text>
<text x="830" y="286" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start" >write recipes are left out there too; composes keeps the two it may suggest with.</text>
<text x="830" y="314" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start" >Why: a recipe for a request the model may not make only invites a refused request</text>
<text x="830" y="332" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start" >(the same reason the lens leaves its example out when the AI can change nothing).</text>
<rect x="810" y="450" width="660" height="350" rx="10" fill="#f7f3ec" stroke="#d8d2e6" stroke-width="1"/>
<text x="824" y="472" font-size="12" font-weight="600" fill="#6e6880" text-anchor="start" >what a skills.md looks like (computes, shortened)</text>
<text x="830" y="494" font-size="11.5" font-weight="400" fill="#5b4bc4" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace"># Skills of computes</text>
<text x="830" y="512" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace"></text>
<text x="830" y="530" font-size="11.5" font-weight="400" fill="#5b4bc4" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">## Write values and formulas</text>
<text x="830" y="548" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">Uses: set_cells</text>
<text x="830" y="566" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">A formula starts with =. Rows and columns count from 0.</text>
<text x="830" y="584" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">```commands</text>
<text x="830" y="602" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">[{"method": "set_cells", "params": {"sheet": "s1",</text>
<text x="830" y="620" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">  "cells": [{"row": 0, "col": 0, "input": "=SUM(B1:B9)"}]}}]</text>
<text x="830" y="638" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">```</text>
<text x="830" y="656" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace"></text>
<text x="830" y="674" font-size="11.5" font-weight="400" fill="#5b4bc4" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">## Add a sheet</text>
<text x="830" y="692" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">Uses: add_sheet</text>
<text x="830" y="710" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">Give the sheet a name the person can recognise …</text>
<text x="830" y="738" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start" >Every recipe names its requests in a Uses: line (a test); the model reads the text without that line.</text>
<rect x="40" y="826" width="26" height="12" rx="3" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="74" y="836" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start" >exists today</text>
<rect x="170" y="826" width="26" height="12" rx="3" fill="#fff" stroke="#d6477a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="204" y="836" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start" >new in E7.2 (dashed)</text>
<text x="360" y="836" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start" >bold coloured line = new or changed member of an existing class · «…» = kind · open triangle = is a</text>
</svg>
