<text x="78" y="168" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#1F1A33" text-anchor="start">Board minutes, 3 November</text>
<rect x="44" y="155" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#B8B2C6" stroke-width="1" />
<text x="78" y="210" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#1F1A33" text-anchor="start">Present: Ana, Bob, Cy, Dana</text>
<rect x="44" y="197" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#B8B2C6" stroke-width="1" />
<text x="78" y="245" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#1F1A33" text-anchor="start">1. Budget 2027 was approved as proposed. The reserve</text>
<rect x="44" y="232" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#B8B2C6" stroke-width="1" />
<text x="78" y="280" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#1F1A33" text-anchor="start">    stays at four months of costs.</text>
<rect x="68" y="296" width="500" height="27" rx="4" fill="#FBE7C6" />
<text x="78" y="315" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#9A93AE" text-anchor="start">██ ███ ████ ███████ ███ ██████ ███ ██████████ ███ ███</text>
<rect x="44" y="302" width="16" height="16" rx="4" fill="#5B4BC4" />
<path d="M48,310.5 L51,313.5 L56.5,307" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="68" y="331" width="500" height="27" rx="4" fill="#FBE7C6" />
<text x="78" y="350" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="400" fill="#9A93AE" text-anchor="start">    ███ ██ ██████████ ██ ████ ██ ███ █████████ ██ █████</text>
<text x="78" y="385" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#1F1A33" text-anchor="start">3. The office move is planned for March.</text>
<rect x="44" y="372" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#B8B2C6" stroke-width="1" />
<text x="78" y="420" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#1F1A33" text-anchor="start">4. Next meeting: 1 December.</text>
