<circle cx="588" cy="290" r="10" fill="#5B4BC4"/>
<text x="588" y="294" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="24" cy="330" r="10" fill="#5B4BC4"/>
<text x="24" y="334" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="16" y="616" width="560" height="82" rx="8" fill="#FFFDF7" stroke="#5B4BC4" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="28" y="638" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5B4BC4" text-anchor="start">1  An import is one step but a whole document (D723). In parts, the units are what the</text>
<text x="28" y="654" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start">     app can point at: paragraphs, pictures and boxes (composes), sheets, ranges, charts</text>
<text x="28" y="670" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start">     and objects (computes), slides and objects (creates).</text>
<text x="28" y="686" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start">2  &quot;Pick in the text…&quot; closes the dialog into pick mode; Enter brings it back.</text>
