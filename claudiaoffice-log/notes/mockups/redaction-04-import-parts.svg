<text x="654" y="239" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F1A33" text-anchor="start">Everything that was imported</text>
<text x="654" y="257" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6580" text-anchor="start">Every paragraph turns into ████, the picture turns grey, the file&#x27;s name goes.</text>
