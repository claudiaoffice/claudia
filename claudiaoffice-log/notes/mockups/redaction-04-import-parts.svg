<text x="654" y="305" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#1F1A33" text-anchor="start">Paragraph 2 (&quot;The bank changed the access …&quot;)</text>
<rect x="654" y="316" width="150" height="28" rx="8" fill="#FFFFFF" stroke="#DAD4C8" stroke-width="1" />
<text x="729.0" y="334.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1F1A33" text-anchor="middle">Pick in the text…</text>
<text x="628" y="382" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1F1A33" text-anchor="start">What this means</text>
<circle cx="634" cy="406" r="3" fill="#C01C28"/>
<text x="646" y="410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#C01C28" text-anchor="start">Nobody can bring it back: not you, not the server, not undo.</text>
<circle cx="634" cy="432" r="3" fill="#1F1A33"/>
<text x="646" y="436" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F1A33" text-anchor="start">The kept original file minutes.docx is removed either way: it holds the PIN too.</text>
<circle cx="634" cy="458" r="3" fill="#1F1A33"/>
<text x="646" y="462" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F1A33" text-anchor="start">What was typed after the import stays; it keeps its place in the text.</text>
<circle cx="634" cy="484" r="3" fill="#1F1A33"/>
<text x="646" y="488" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F1A33" text-anchor="start">Copies, downloads, exports and backups made before keep it.</text>
