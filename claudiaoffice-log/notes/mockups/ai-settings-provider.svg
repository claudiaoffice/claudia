<text x="40" y="66" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Same shell as AdminShell.vue: ink bar and sidebar, the server's name always visible. The page is the server's own, reached by URL plus the access secret.</text>
