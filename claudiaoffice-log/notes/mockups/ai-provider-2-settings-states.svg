<text x="493.33333333333337" y="168" font-size="13" font-weight="500" fill="#f7f3ec" text-anchor="middle">Claude</text>
<text x="60" y="216" font-size="12.5" font-weight="500" fill="#6e6880" text-anchor="start">Provider key</text>
<rect x="60" y="224" width="520" height="38" rx="9" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="74" y="247.5" font-size="13" font-weight="400" fill="#6e6880" text-anchor="start">Paste the key of your Anthropic account</text>
<rect x="60" y="282" width="620" height="138" rx="12" fill="#fdf3e6" stroke="#f2a057" stroke-width="1.5"/>
<rect x="78" y="302" width="18" height="18" rx="4" fill="#ffffff" stroke="#8d86a8" stroke-width="1.2"/>
<text x="110" y="318" font-size="14" font-weight="600" fill="#1f1a33" text-anchor="start">Document content is sent to Anthropic when someone asks @ai.</text>
<text x="110" y="340" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Documents are encrypted on this server; Claude reads what it is shown in plain text.</text>
<line x1="78" y1="356" x2="662" y2="356" stroke="#f0cfa6" stroke-width="1"/>
<text x="78" y="376" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="start">The owner of each document must also allow Claude there (Preferences ▸ AI…).</text>
<text x="78" y="394" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Until the owner allows it, @ai in that document uses the local model or the stand-in.</text>
<text x="60" y="450" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">Apply needs a key and the confirmed sentence.</text>
<rect x="500" y="468" width="80" height="38" rx="9" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="540.0" y="491.5" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="middle">Cancel</text>
<rect x="590" y="468" width="90" height="38" rx="9" fill="#b3abe0"/>
<text x="635.0" y="491.5" font-size="13" font-weight="500" fill="#f7f3ec" text-anchor="middle">Apply</text>
<rect x="720" y="96" width="640" height="430" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="740" y="126" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">B · The test failed: nothing is changed</text>
