<rect x="1268" y="162" width="72" height="38" rx="9" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="1304.0" y="185.5" font-size="13" font-weight="500" fill="#9a2f4a" text-anchor="middle">Remove</text>
<rect x="740" y="226" width="600" height="108" rx="12" fill="#fbeef2" stroke="#9a2f4a" stroke-width="1.5"/>
<path d="M758 248 l9 9 M767 248 l-9 9" stroke="#9a2f4a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<text x="782" y="258" font-size="14" font-weight="600" fill="#9a2f4a" text-anchor="start">Anthropic refused the key.</text>
<text x="782" y="280" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Nothing was changed: @ai still answers with Qwen2.5-7B · this server.</text>
<text x="782" y="300" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Check the key in your Anthropic account, then Apply again.</text>
<text x="782" y="320" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace">Test question sent today 09:31 · HTTP 401</text>
<text x="740" y="364" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">Why it is refused here: the first person to ask @ai would otherwise find it out.</text>
<rect x="1170" y="468" width="80" height="38" rx="9" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="1210.0" y="491.5" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="middle">Cancel</text>
<rect x="1260" y="468" width="80" height="38" rx="9" fill="#5b4bc4"/>
<text x="1300.0" y="491.5" font-size="13" font-weight="500" fill="#f7f3ec" text-anchor="middle">Apply</text>
<rect x="40" y="546" width="660" height="400" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="60" y="576" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">C · Later, a question fails: the page says why</text>
<rect x="60" y="596" width="620" height="44" rx="10" fill="#e7e1f4"/>
<circle cx="80" cy="618" r="5" fill="#5b4bc4"/>
<text x="94" y="623" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Answering now:</text>
<text x="200" y="623" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Claude · claude-sonnet-5-5</text>
<rect x="402.4" y="607" width="74" height="22" rx="11.0" fill="#5b4bc4"/>
<text x="439.4" y="622" font-size="11.5" font-weight="500" fill="#f7f3ec" text-anchor="middle">remote</text>
<text x="666" y="623" font-size="12" font-weight="400" fill="#6e6880" text-anchor="end">changed by anna, 09:12</text>
<rect x="60" y="652" width="620" height="120" rx="12" fill="#fbeef2" stroke="#9a2f4a" stroke-width="1.5"/>
<circle cx="84" cy="680" r="6" fill="#9a2f4a"/>
<text x="102" y="685" font-size="13" font-weight="600" fill="#9a2f4a" text-anchor="start">Last error · today 14:02</text>
<text x="102" y="708" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="start">The credit balance at Anthropic is used up.</text>
<text x="102" y="728" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Questions to Claude fail until credit is added or another provider is chosen.</text>
<text x="102" y="752" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Stays until the next question to Claude is answered.</text>
<text x="60" y="808" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">No automatic switch to the local model: the person asking would not know who answered.</text>
<text x="60" y="826" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">The administrator decides: add credit, or choose another provider above.</text>
<rect x="720" y="546" width="640" height="400" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="740" y="576" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">D · The words: one sentence for her, the reason for him</text>
<rect x="740" y="594" width="600" height="64" rx="10" fill="#1f1a33"/>
<text x="756" y="616" font-size="11.5" font-weight="400" fill="#a9a3bd" text-anchor="start">In the chat, for the person who asked, whatever the cause:</text>
<text x="756" y="640" font-size="13" font-weight="500" fill="#f7f3ec" text-anchor="start">Claude is not available at the moment. The administrator can see why.</text>
<text x="740" y="686" font-size="12.5" font-weight="600" fill="#6e6880" text-anchor="start">On the settings page, for the administrator</text>
