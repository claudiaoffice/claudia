<text x="754" y="185.5" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace">sk-ant-•••••••••••••••••••• 9ZkP</text>
<rect x="1172" y="162" width="88" height="38" rx="9" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
