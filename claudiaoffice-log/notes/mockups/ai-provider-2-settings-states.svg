<text x="890" y="754" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">The credit balance at Anthropic is used up.</text>
<line x1="740" y1="768" x2="1340" y2="768" stroke="#d8d2e6" stroke-width="1"/>
<text x="740" y="788" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="start">Rate limit</text>
<text x="890" y="788" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Anthropic's rate limit was reached.</text>
<line x1="740" y1="802" x2="1340" y2="802" stroke="#d8d2e6" stroke-width="1"/>
<text x="740" y="822" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="start">Overloaded</text>
<text x="890" y="822" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Anthropic is overloaded at the moment.</text>
<line x1="740" y1="836" x2="1340" y2="836" stroke="#d8d2e6" stroke-width="1"/>
<text x="740" y="856" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="start">No network</text>
<text x="890" y="856" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Anthropic cannot be reached from this server.</text>
<line x1="740" y1="870" x2="1340" y2="870" stroke="#d8d2e6" stroke-width="1"/>
<text x="740" y="890" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="start">Unknown model</text>
<text x="890" y="890" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Anthropic does not know the model “claude-x”.</text>
<text x="40" y="970" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">'&lt;AI type&gt;' is the provider's name: Claude here, and the same sentence for the local model if it fails.</text>
