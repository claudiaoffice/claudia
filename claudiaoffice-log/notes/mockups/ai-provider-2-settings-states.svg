<text x="320.0" y="168" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="middle">Local model</text>
<rect x="406.6666666666667" y="144" width="173.33333333333334" height="38" rx="9" fill="#5b4bc4"/>
