<svg viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">claudia — Server settings ▸ AI: before applying, a failed test, a later failure, and the words of each failure</title><desc id="d">Four states of the AI settings page: Claude chosen but not yet applied, the test refused, an error shown after the server was running, and the table of failures with the words the administrator and the person asking read.</desc>
<rect x="0" y="0" width="1400" height="980" fill="#f3f1ea"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">claudia — Server settings ▸ AI: what goes wrong, and where it is said (E7.11)</text>
<text x="40" y="66" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Cut-outs of the page of ai-provider-1. The person asking always reads the same sentence in the chat; only the administrator reads the reason.</text>
<rect x="40" y="96" width="660" height="430" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="60" y="126" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">A · Claude chosen, nothing applied yet</text>
