<text x="60.0" y="548.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Why HTTP for Remove: the New dialog is open before any document exists, so it can only talk to /api/templates, as it already does to list and to start a deck.</text>
<text x="60.0" y="576.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Why wire for Add: it happens inside a deck, which is what the server builds the template file from (template_file); the file never travels to the client and back.</text>
<text x="60.0" y="604.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Who is who: the file's exporter is the person who added it (the library rewrites it on add); a template is "mine" when that name is the signed-in person's. An administrator is not the adder of a colleague's template.</text>
<text x="60.0" y="632.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Replace keeps the id and the place; the old file is replaced in one step, so nobody sees a library without it. A name taken by another template is refused in words, as check() does for the administrator's page.</text></svg>