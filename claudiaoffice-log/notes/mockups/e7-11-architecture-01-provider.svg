<text x="700" y="731" font-size="11.5" fill="#1f1a33">Placement: ModelRunner stays as it is (it knows no document). A second one over ClaudeModel gives &quot;one question</text>
<text x="700" y="747" font-size="11.5" fill="#1f1a33">at a time&quot; for free. The desk is the only place that knows both providers; the router (diagram 2) asks it per</text>
<text x="700" y="763" font-size="11.5" fill="#1f1a33">question, so nothing is fixed when a document opens.</text>
