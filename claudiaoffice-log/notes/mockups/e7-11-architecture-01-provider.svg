<svg viewBox="0 0 1500 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">claudia - E7.11 architecture 1: the provider</title><desc id="d">Class diagram: ClaudeModel next to OpenVinoModel behind LanguageModel, ProviderError with FailureReason, and in the server the settings, AiRuntime, ProviderDesk, ProviderHealth and Decision.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6880"/></marker><marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#fff" stroke="#6e6880" stroke-width="1.2"/></marker></defs>
<rect width="1500" height="900" fill="#f3f1ea"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#1f1a33" font-family="Fraunces, Georgia, serif">E7.11 architecture 1 — the provider: Claude is one more LanguageModel; the server picks who answers</text>
<text x="40" y="66" font-size="12.5" fill="#6e6880">claudia_ai stays free of the server: it knows models and their failures. claudia_server knows settings, approval and health.</text>
<rect x="30" y="90" width="620" height="730" rx="10" fill="#f7f3ec" stroke="#d8d2e6"/>
<text x="44" y="112" font-size="12" font-weight="600" fill="#6e6880">claudia_ai  (no server, no document)</text>
<rect x="670" y="90" width="800" height="730" rx="10" fill="#f7f3ec" stroke="#d8d2e6"/>
<text x="684" y="112" font-size="12" font-weight="600" fill="#6e6880">claudia_server</text>
