<rect x="40" y="710" width="1320" height="150" rx="10" fill="#ffffff" stroke="#cfc9dc"/>
<text x="54" y="734" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#1f1a33" text-anchor="start">Not in this patch (backlog, E3.13)</text>
<text x="54" y="756" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#3d3752" text-anchor="start">• Fetch an open collection from a pinned list (server-side, SHA-256 checked), Edit stand-ins…, Remove file… — the second patch the owner chose to defer.</text>
<text x="54" y="774" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#3d3752" text-anchor="start">• The web client does not send the access secret when it loads fonts for layout and print: a document&#x27;s people get This-server fonts only on a server without a secret.</text>
<text x="54" y="792" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#3d3752" text-anchor="start">• No export or PDF checks This-server fonts yet; LaTeX formulas see added fonts after a restart (the LaTeX plugin keeps the catalogue it was started with).</text>
<text x="54" y="810" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#3d3752" text-anchor="start">• Bug found: after naming the first administrator the settings page stays on the setup form until reloaded (reported, not fixed here).</text>
</svg>