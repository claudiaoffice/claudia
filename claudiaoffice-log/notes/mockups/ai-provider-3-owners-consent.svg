<svg viewBox="0 0 1400 1020" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">claudia — Preferences ▸ AI…: the owners decide whether Claude may answer in a document</title><desc id="d">The menu entry in Preferences with its key, and the dialog in four states: an owner with Claude off, an owner with Claude on, an editor, and a server with no remote AI.</desc>
<rect x="0" y="0" width="1400" height="1020" fill="#f3f1ea"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">claudia — Preferences ▸ AI…: the owners' consent for Claude, per document (E7.11, D264)</text>
<text x="40" y="66" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">For your review. Same entry, key, words and dialog in composes, computes and creates, in the web app and in both desktop clients. Everyone can open it; only owners can change it.</text>
<rect x="40" y="100" width="320" height="232" rx="10" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="58" y="126" font-size="12" font-weight="600" fill="#6e6880" text-anchor="start">Preferences</text>
<text x="58" y="154" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">App language</text>
<text x="322" y="154" font-size="13" font-weight="400" fill="#6e6880" text-anchor="end">▸</text>
<text x="58" y="180" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">Shortcuts</text>
<text x="322" y="180" font-size="12" font-weight="400" fill="#6e6880" text-anchor="end">Ctrl+?</text>
<line x1="50" y1="196" x2="350" y2="196" stroke="#d8d2e6" stroke-width="1"/>
<rect x="46" y="206" width="308" height="32" rx="6" fill="#ece8f8"/>
<text x="58" y="227" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">AI…</text>
<text x="346" y="227" font-size="12" font-weight="400" fill="#5b4bc4" text-anchor="end">Ctrl+Shift+Alt+H</text>
<text x="58" y="266" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Key proposed: free in all three apps, and clear of</text>
<text x="58" y="282" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">AltGr on a German keyboard (Ctrl+Shift+Alt+letter).</text>
<text x="58" y="300" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Config is renamed Preferences in this story: all three</text>
<text x="58" y="316" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">apps, the web app and both desktop clients.</text>
<rect x="40" y="352" width="320" height="154" rx="10" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="58" y="378" font-size="12" font-weight="600" fill="#6e6880" text-anchor="start">macOS: the app menu</text>
<text x="58" y="406" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">About claudia</text>
<text x="58" y="432" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">Settings…</text>
<text x="322" y="432" font-size="12" font-weight="400" fill="#6e6880" text-anchor="end">Cmd+,</text>
<text x="58" y="458" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">AI…</text>
<text x="322" y="458" font-size="12" font-weight="400" fill="#6e6880" text-anchor="end">Cmd+Shift+Option+H</text>
<text x="58" y="484" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">Quit claudia</text>
<rect x="400" y="100" width="470" height="400" rx="14" fill="#ffffff" stroke="#8d86a8" stroke-width="1.5"/>
<text x="424" y="136" font-size="18" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">AI in this document</text>
<text x="424" y="166" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Answering @ai in this document now</text>
<text x="424" y="188" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Qwen2.5-7B · this server</text>
<rect x="424" y="218" width="18" height="18" rx="4" fill="#ffffff" stroke="#8d86a8" stroke-width="1.2"/>
<text x="452" y="232" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="start">Allow Claude to answer @ai in this document</text>
<text x="452" y="250" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Off by default. Only the owners can change it.</text>
<text x="424" y="290" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">If you allow it, Anthropic is sent:</text>
<text x="424" y="310" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">•  the question, and the earlier chat between the person</text>
<text x="438" y="327" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">who asks and the ai</text>
<text x="424" y="347" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">•  the parts of this document the ai looks at to answer her</text>
<text x="424" y="373" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Documents are encrypted on this server. Claude reads what</text>
<text x="424" y="389" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">it is shown in plain text.</text>
<rect x="424" y="440" width="90" height="36" rx="18.0" fill="#b3abe0"/>
<text x="469.0" y="462.5" font-size="13" font-weight="500" fill="#f7f3ec" text-anchor="middle">Save</text>
<rect x="526" y="440" width="90" height="36" rx="18.0" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="571.0" y="462.5" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="middle">Cancel</text>
<text x="640" y="462" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Enter saves · Esc cancels</text>
<text x="424" y="90" font-size="12.5" font-weight="600" fill="#6e6880" text-anchor="start">1 · An owner, Claude off (the default for every document)</text>
<rect x="890" y="100" width="470" height="400" rx="14" fill="#ffffff" stroke="#8d86a8" stroke-width="1.5"/>
<text x="914" y="136" font-size="18" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">AI in this document</text>
<text x="914" y="166" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Answering @ai in this document now</text>
<text x="914" y="188" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Claude · claude-sonnet-5-5</text>
<rect x="1113.2" y="174" width="74" height="22" rx="11.0" fill="#5b4bc4"/>
<text x="1150.2" y="189" font-size="11.5" font-weight="500" fill="#f7f3ec" text-anchor="middle">remote</text>
<rect x="914" y="218" width="18" height="18" rx="4" fill="#5b4bc4"/>
<path d="M918 227 l3.5 3.5 6.5 -7.5" stroke="#f7f3ec" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="942" y="232" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="start">Allow Claude to answer @ai in this document</text>
<text x="942" y="250" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Allowed by anna, today 09:40 · for Claude (Anthropic)</text>
<text x="914" y="290" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">If you allow it, Anthropic is sent:</text>
<text x="914" y="310" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">•  the question, and the earlier chat between the person</text>
<text x="928" y="327" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">who asks and the ai</text>
<text x="914" y="347" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">•  the parts of this document the ai looks at to answer her</text>
<text x="914" y="373" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Documents are encrypted on this server. Claude reads what</text>
<text x="914" y="389" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">it is shown in plain text.</text>
<text x="914" y="416" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Switching it off stops a question that is running before its next step.</text>
<rect x="914" y="440" width="90" height="36" rx="18.0" fill="#4b3fb0"/>
<text x="959.0" y="462.5" font-size="13" font-weight="600" fill="#f7f3ec" text-anchor="middle">Save</text>
<rect x="1016" y="440" width="90" height="36" rx="18.0" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="1061.0" y="462.5" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="middle">Cancel</text>
<text x="1130" y="462" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Enter saves · Esc cancels</text>
<text x="914" y="90" font-size="12.5" font-weight="600" fill="#6e6880" text-anchor="start">2 · An owner, Claude on: who allowed it and when is shown</text>
<rect x="400" y="560" width="470" height="330" rx="14" fill="#ffffff" stroke="#8d86a8" stroke-width="1.5"/>
<text x="424" y="596" font-size="18" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">AI in this document</text>
<text x="424" y="626" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Answering @ai in this document now</text>
<text x="424" y="648" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Claude · claude-sonnet-5-5</text>
<rect x="623.2" y="634" width="74" height="22" rx="11.0" fill="#5b4bc4"/>
<text x="660.2" y="649" font-size="11.5" font-weight="500" fill="#f7f3ec" text-anchor="middle">remote</text>
<rect x="424" y="678" width="18" height="18" rx="4" fill="#6e6880"/>
<path d="M428 687 l3.5 3.5 6.5 -7.5" stroke="#f7f3ec" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="452" y="692" font-size="13" font-weight="500" fill="#6e6880" text-anchor="start">Allow Claude to answer @ai in this document</text>
<text x="452" y="710" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Allowed by anna, today 09:40 · for Claude (Anthropic)</text>
<text x="424" y="750" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="start">Only the owners can change this: anna and jonas.</text>
<text x="424" y="772" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">What Claude is sent when someone asks @ai is listed here for</text>
<text x="424" y="789" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">everybody: the question, the earlier chat with the person who</text>
<text x="424" y="806" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">asks, and the parts of the document the ai looks at.</text>
<rect x="424" y="834" width="90" height="36" rx="18.0" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="469.0" y="856.5" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="middle">Close</text>
<text x="424" y="550" font-size="12.5" font-weight="600" fill="#6e6880" text-anchor="start">3 · An editor or viewer: she sees it, and cannot change it</text>
<rect x="890" y="560" width="470" height="330" rx="14" fill="#ffffff" stroke="#8d86a8" stroke-width="1.5"/>
<text x="914" y="596" font-size="18" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">AI in this document</text>
<text x="914" y="626" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Answering @ai in this document now</text>
<text x="914" y="648" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Qwen2.5-7B · this server</text>
<rect x="914" y="672" width="422" height="92" rx="10" fill="#f4f1fa" stroke="#d8d2e6" stroke-width="1"/>
<text x="930" y="698" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="start">This server has no remote AI, so nothing in this</text>
<text x="930" y="716" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="start">document leaves it.</text>
<text x="930" y="740" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">An administrator can add Claude in the server settings.</text>
<text x="914" y="792" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Then the owners can allow it here.</text>
<rect x="914" y="834" width="90" height="36" rx="18.0" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="959.0" y="856.5" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="middle">Close</text>
<text x="914" y="550" font-size="12.5" font-weight="600" fill="#6e6880" text-anchor="start">4 · The server offers no remote provider: nothing to switch</text>
<text x="40" y="926" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">• What the dialog says is what Claude is sent: the question, the earlier chat between the asker and the ai, and the parts of the document the ai looks at for her. The owners agree to exactly that.</text>
<text x="40" y="946" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">• The consent names one provider. If the server later uses a different remote provider, this dialog says it is not allowed yet and the owners are asked again; removing and re-adding Claude keeps it.</text>
<text x="40" y="966" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">• Saving takes effect at once: a question running through Claude stops before its next round and the chat says so (ai-provider-4). The title says 'in this document' because the menu holds the person's own settings.</text>
<text x="40" y="986" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">• Disabled entry: never; a viewer opens the dialog too, because the document's privacy is everybody's business. Menu entry and key go into claudia-menus.xlsx when this is agreed.</text>
</svg>
