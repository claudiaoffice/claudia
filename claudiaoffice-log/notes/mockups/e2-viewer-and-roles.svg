<svg viewBox="0 0 1400 860" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<rect x="0" y="0" width="1400" height="860" fill="#f3f1ea"/>
<text x="40" y="44" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start">claudia — viewers, changing a role and removing someone, proposed (E2.3, E2.4)</text>
<text x="40" y="66" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">A viewer's dock and the waiting state (docked panel, the same in the web app and the desktop clients); the Share dialog's role change; the remove confirmation. Nothing is built until it is agreed.</text>
<rect x="40" y="96" width="420" height="724" rx="14" fill="#fbfaf8" stroke="#d8d2e6" stroke-width="1"/>
<text x="62" y="130" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#1f1a33" text-anchor="start">A · What a viewer's dock shows</text>
<text x="62" y="150" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">A viewer reads and sees who is here, and gets one sentence</text>
<text x="62" y="166" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">where History &amp; Chat would be (D1261).</text>
<rect x="62" y="176" width="376" height="312" rx="14" fill="#1f1a33"/>
<text x="82" y="210" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f7f3ec" text-anchor="start">History &amp; Chat</text>
<text x="212" y="210" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#a9a3bd" text-anchor="start">Help</text>
<line x1="76" y1="222" x2="182" y2="222" stroke="#5b4bc4" stroke-width="2"/>
<rect x="238.0" y="276" width="24" height="18" rx="4" fill="none" stroke="#a9a3bd" stroke-width="1.6"/>
<path d="M 243.0 276 v -6 a 7 7 0 0 1 14 0 v 6" fill="none" stroke="#a9a3bd" stroke-width="1.6"/>
<text x="250.0" y="326" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="400" fill="#f7f3ec" text-anchor="middle">History and chat are for the</text>
<text x="250.0" y="345" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="400" fill="#f7f3ec" text-anchor="middle">document's editors.</text>
<text x="250.0" y="370" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#a9a3bd" text-anchor="middle">You can read and look; you cannot change anything.</text>
<line x1="82" y1="392" x2="418" y2="392" stroke="#3a3358" stroke-width="1"/>
<text x="82" y="416" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#a9a3bd" text-anchor="start">Here now</text>
<circle cx="90" cy="438" r="5" fill="#d6477a"/>
<text x="102" y="442" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#cfc9e3" text-anchor="start">anna</text>
<circle cx="162" cy="438" r="5" fill="#13917f"/>
<text x="174" y="442" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#cfc9e3" text-anchor="start">tobi</text>
<circle cx="234" cy="438" r="5" fill="#5b4bc4"/>
<text x="246" y="442" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#cfc9e3" text-anchor="start">ai</text>
<text x="82" y="464" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#a9a3bd" text-anchor="start">Names and places, as for everyone (D111).</text>
<text x="62" y="524" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">A viewer who opens first (D1262)</text>
<rect x="62" y="540" width="376" height="246" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="80" y="570" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start">plan</text>
<line x1="62" y1="584" x2="438" y2="584" stroke="#e3dfee" stroke-width="1"/>
<text x="80" y="610" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">An editor or owner has to open this document</text>
<text x="80" y="629" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">first. This window will open it as soon as one</text>
<text x="80" y="648" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">has.</text>
<circle cx="92" cy="689" r="8" fill="none" stroke="#e3dfee" stroke-width="2.5"/>
<path d="M 92 681 a 8 8 0 0 1 8 8" fill="none" stroke="#5b4bc4" stroke-width="2.5" stroke-linecap="round"/>
<text x="110" y="693" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Trying again every few seconds…</text>
<rect x="342" y="738" width="78" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="381.0" y="757.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="middle">Close</text>
<text x="80" y="758" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">The words are new; the retry is as today.</text>
<rect x="490" y="96" width="420" height="724" rx="14" fill="#fbfaf8" stroke="#d8d2e6" stroke-width="1"/>
<text x="512" y="130" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#1f1a33" text-anchor="start">B · Share… — changing a role</text>
<text x="512" y="150" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">One action for owners. A change that takes keys away says</text>
<text x="512" y="166" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">what it protects and what it does not (D1263).</text>
<rect x="512" y="176" width="376" height="580" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="530" y="206" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start">Share “plan”</text>
<line x1="512" y1="220" x2="888" y2="220" stroke="#e3dfee" stroke-width="1"/>
<text x="530" y="246" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#1f1a33" text-anchor="start">People in this document</text>
<rect x="530" y="258" width="340" height="44" rx="8" fill="#fff" stroke="#e3dfee" stroke-width="1"/>
<circle cx="548" cy="280" r="6" fill="#d6477a"/>
<text x="562" y="285" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">anna</text>
<text x="862" y="285" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="end">you · owner</text>
<rect x="530" y="310" width="340" height="44" rx="8" fill="#fff" stroke="#e3dfee" stroke-width="1"/>
<circle cx="548" cy="332" r="6" fill="#13917f"/>
<text x="562" y="337" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">tobi</text>
<rect x="740" y="317" width="120" height="30" rx="6" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="752" y="337" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="start">only look</text>
<text x="846" y="337" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">▾</text>
<rect x="530" y="362" width="340" height="44" rx="8" fill="#fff" stroke="#e3dfee" stroke-width="1"/>
<circle cx="548" cy="384" r="6" fill="#f2a057"/>
<text x="562" y="389" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">ben</text>
<rect x="740" y="369" width="120" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="752" y="389" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">edit</text>
<text x="846" y="389" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">▾</text>
<text x="530" y="426" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#5b4bc4" text-anchor="start">Add a person…</text>
<rect x="530" y="448" width="340" height="121" rx="8" fill="#fbf6e8" stroke="#ecdcae" stroke-width="1"/>
<rect x="530" y="448" width="4" height="121" rx="2" fill="#b3841a"/>
<text x="546" y="470" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f1a33" text-anchor="start">Change tobi to “only look”?</text>
<text x="546" y="488" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">From now on tobi cannot read history or chat, in</text>
<text x="546" y="505" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">files he already holds either. He keeps what he</text>
<text x="546" y="522" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">has already seen and any copy he has saved. The</text>
<text x="546" y="539" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">document's keys are renewed; for this document</text>
<text x="546" y="556" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">that takes about a second.</text>
<text x="530" y="595" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">Why: his old keys still open what was written before; the new ones</text>
<text x="530" y="611" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">protect what is written from now on.</text>
<rect x="638" y="708" width="78" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="677.0" y="727.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="middle">Cancel</text>
<rect x="724" y="708" width="146" height="30" rx="6" fill="#1f1a33"/>
<text x="797.0" y="727.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#f7f3ec" text-anchor="middle">Change to only look</text>
<text x="530" y="635" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">Edit → only look renews keys. Only look → edit does not.</text>
<rect x="940" y="96" width="420" height="724" rx="14" fill="#fbfaf8" stroke="#d8d2e6" stroke-width="1"/>
<text x="962" y="130" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#1f1a33" text-anchor="start">C · Removing someone</text>
<text x="962" y="150" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Removal renews every key the person held (D1263); private</text>
<text x="962" y="166" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">notes get one sentence (D1265).</text>
<rect x="962" y="176" width="376" height="330" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="980" y="206" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start">Remove tobi from “plan”?</text>
<line x1="962" y1="220" x2="1338" y2="220" stroke="#e3dfee" stroke-width="1"/>
<text x="980" y="244" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">tobi will no longer be able to open this document</text>
<text x="980" y="263" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">or read anything written after now.</text>
<text x="980" y="290" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">He keeps what he has already seen and any copy of</text>
<text x="980" y="309" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">the file he holds.</text>
<text x="980" y="336" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Any private notes of this person are deleted.</text>
<text x="980" y="363" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">The document's keys are renewed. This takes a</text>
<text x="980" y="382" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">moment, and everybody who is here stays connected.</text>
<rect x="1070" y="458" width="78" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="1109.0" y="477.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="middle">Cancel</text>
<rect x="1156" y="458" width="164" height="30" rx="6" fill="#1f1a33"/>
<text x="1238.0" y="477.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#f7f3ec" text-anchor="middle">Remove tobi</text>
<text x="962" y="540" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">…and while it works</text>
<rect x="962" y="556" width="376" height="150" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="980" y="586" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start">Renewing the keys…</text>
<line x1="962" y1="600" x2="1338" y2="600" stroke="#e3dfee" stroke-width="1"/>
<rect x="980" y="622" width="340" height="8" rx="4" fill="#e3dfee"/>
<rect x="980" y="622" width="190" height="8" rx="4" fill="#5b4bc4"/>
<text x="980" y="654" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">plan can be read and edited as usual while this runs.</text>
<text x="980" y="674" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">A long document takes longer: about as long as writing</text>
<text x="980" y="689" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">the file once.</text>
<text x="40" y="846" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">Wording to confirm: “only look” is today's label for the viewer role in the dialog. Who may do any of this: owners only; the last owner cannot be changed, ownership moves by handover (D142).</text>
</svg>
