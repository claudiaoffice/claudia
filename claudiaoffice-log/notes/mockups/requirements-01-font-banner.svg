<svg viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">claudia — on opening: a font this server does not have</title><desc id="d">The banner under the toolbar in three states (can be fetched, cannot be fetched, dismissed) and the details list.</desc>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f1a33" flood-opacity="0.18"/></filter></defs>
<rect width="1400" height="820" fill="#f3f1ea"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">claudia — the report when a document opens and a font is missing (E1.9, D1306)</text>
<text x="40" y="66" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">The document opens and can be edited; nothing is blocked. The function half of the same banner is parked (D1313), so only fonts are drawn. For the words and the screens of the font service itself see E3.13.</text>
<text x="40" y="100" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">A  The font can be fetched</text>
<rect x="40" y="110" width="1320" height="56" rx="8" fill="#eef0fb" stroke="#b9b2e8" stroke-width="1"/>
<rect x="54" y="127" width="22" height="22" rx="11" fill="#4b3fb0"/>
<text x="65" y="143" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">i</text>
<text x="88" y="134" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">“Gill Sans” is not on this server. It is shown in Lato until the font is installed.</text>
<text x="88" y="153" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">Your text keeps the name “Gill Sans”; nothing is changed in the document.</text>
<text x="1340" y="143" font-size="20" font-weight="400" fill="#6e6880" text-anchor="end">×</text>
<rect x="1189.8" y="124" width="124.2" height="28" rx="14" fill="#fff" stroke="#8d86a8" stroke-width="1"/>
<text x="1251.8999999999999" y="143" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="middle">Get Gill Sans</text>
<rect x="1094.6" y="124" width="87.2" height="28" rx="14" fill="#fff" stroke="#8d86a8" stroke-width="1"/>
<text x="1138.1999999999998" y="143" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="middle">Details…</text>
<text x="40" y="196" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">B  The font cannot be fetched (or you may not install it)</text>
<rect x="40" y="206" width="1320" height="56" rx="8" fill="#fff7e0" stroke="#e0c46c" stroke-width="1"/>
<rect x="54" y="223" width="22" height="22" rx="11" fill="#4b3fb0"/>
<text x="65" y="239" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">i</text>
<text x="88" y="230" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">“Frutiger” is not on this server. It is shown in Liberation Sans.</text>
<text x="88" y="249" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">Ask the administrator of this server to install it. Your text keeps the name “Frutiger”.</text>
<text x="1340" y="239" font-size="20" font-weight="400" fill="#6e6880" text-anchor="end">×</text>
<rect x="1226.8" y="220" width="87.2" height="28" rx="14" fill="#fff" stroke="#8d86a8" stroke-width="1"/>
<text x="1270.3999999999999" y="239" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="middle">Details…</text>
<text x="40" y="292" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">C  Two fonts, one can be fetched</text>
<rect x="40" y="302" width="1320" height="56" rx="8" fill="#eef0fb" stroke="#b9b2e8" stroke-width="1"/>
<rect x="54" y="319" width="22" height="22" rx="11" fill="#4b3fb0"/>
<text x="65" y="335" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">i</text>
<text x="88" y="326" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">2 fonts of this document are not on this server.</text>
<text x="88" y="345" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">“Gill Sans” can be installed; “Frutiger” cannot. Both are shown in a stand-in for now.</text>
<text x="1340" y="335" font-size="20" font-weight="400" fill="#6e6880" text-anchor="end">×</text>
<rect x="1189.8" y="316" width="124.2" height="28" rx="14" fill="#fff" stroke="#8d86a8" stroke-width="1"/>
<text x="1251.8999999999999" y="335" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="middle">Get Gill Sans</text>
<rect x="1094.6" y="316" width="87.2" height="28" rx="14" fill="#fff" stroke="#8d86a8" stroke-width="1"/>
<text x="1138.1999999999998" y="335" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="middle">Details…</text>
<rect x="40" y="392" width="760" height="300" rx="14" fill="#fff" stroke="#8d86a8" stroke-width="1.5" filter="url(#sh)"/>
<text x="64" y="426" font-size="18" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">Fonts this document needs</text>
<text x="64" y="460" font-size="11.5" font-weight="600" fill="#6e6880" text-anchor="start">Font</text>
<text x="270" y="460" font-size="11.5" font-weight="600" fill="#6e6880" text-anchor="start">Used in</text>
<text x="470" y="460" font-size="11.5" font-weight="600" fill="#6e6880" text-anchor="start">Shown in</text>
<text x="640" y="460" font-size="11.5" font-weight="600" fill="#6e6880" text-anchor="start"></text>
<line x1="56" y1="470" x2="784" y2="470" stroke="#d8d2e6" stroke-width="1"/>
<text x="64" y="494" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Gill Sans</text>
<text x="270" y="494" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">41 paragraphs</text>
<text x="470" y="494" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Lato</text>
<rect x="640" y="476" width="64" height="26" rx="13" fill="#fff" stroke="#8d86a8" stroke-width="1"/>
<text x="672" y="493" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="middle">Get</text>
<text x="64" y="534" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Frutiger</text>
<text x="270" y="534" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">12 paragraphs, 2 slides</text>
<text x="470" y="534" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Liberation Sans</text>
<text x="640" y="534" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">Not available</text>
<text x="64" y="574" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Lato</text>
<text x="270" y="574" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">the rest</text>
<text x="470" y="574" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Lato</text>
<text x="640" y="574" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">On this server</text>
<text x="64" y="640" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">This is the list of fonts and their stand-ins that the font stance of 2026-11-16 asks for.</text>
<text x="830" y="410" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">How it behaves:</text>
<text x="830" y="433" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">•  The check runs when a document is opened, for every person who</text>
<text x="846" y="452" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">opens it, and again when the font service has installed</text>
<text x="846" y="471" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">something. It never blocks opening or editing.</text>
<text x="830" y="494" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">•  The banner is read by a screen reader as a status (“2 fonts of</text>
<text x="846" y="513" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">this document are not on this server”), not as an alert, and</text>
<text x="846" y="532" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">the buttons are reachable by Tab.</text>
<text x="830" y="555" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">•  “×” hides the banner for this person in this document until</text>
<text x="846" y="574" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">what it reports changes; the list stays in the document's</text>
<text x="846" y="593" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Details dialog.</text>
<text x="830" y="616" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">•  Who may press “Get”: proposal, only a person who may manage</text>
<text x="846" y="635" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">the server's fonts (an administrator). Everyone else sees</text>
<text x="846" y="654" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">state B. Please say if an owner of the document should be able</text>
<text x="846" y="673" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">to, too.</text>
</svg>
