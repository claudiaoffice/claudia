<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700"><defs><marker id="a13917F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#13917F"/></marker><marker id="aB5472A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B5472A"/></marker></defs><rect x="0" y="0" width="1120" height="700" rx="0" fill="#F7F3EC" stroke="#F7F3EC" stroke-width="1.2"/><text x="40" y="44" font-family="Fraunces, Georgia, serif" font-size="18" fill="#1F1A33" font-weight="500" text-anchor="start">Pivot tables in xlsx and ods — where the code goes (D625, D628)</text><text x="40" y="68" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6580" font-weight="400" text-anchor="start">One neutral description of a pivot in a file (FilePivot) sits between the model and the two formats, so the rules are written once.</text><text x="40" y="114" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#13917F" font-weight="600" text-anchor="start">claudia-computes</text><text x="40" y="264" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#13917F" font-weight="600" text-anchor="start">claudia-computes-io, shared</text><text x="40" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#13917F" font-weight="600" text-anchor="start">claudia-computes-io, per format</text><text x="40" y="604" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#13917F" font-weight="600" text-anchor="start">the files</text><rect x="40" y="118" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#D6CFE4" stroke-width="1.2"/><text x="54" y="142" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F1A33" font-weight="600" text-anchor="start">PivotEntry + PivotDefinition</text><text x="54" y="162" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">name, fields, totals, filters</text><text x="54" y="179" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">labels (the words of its cells)</text><text x="54" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">result grid after a calculation</text><rect x="580" y="118" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#D6CFE4" stroke-width="1.2"/><text x="594" y="142" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F1A33" font-weight="600" text-anchor="start">NamedRange (source, result)</text><text x="594" y="162" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">the source is a name: a table or a range</text><text x="594" y="179" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">the result name carries the anchor</text><text x="594" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">sheet.spilled: the cells the pivot fills</text><rect x="310" y="118" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#D6CFE4" stroke-width="1.2"/><text x="324" y="142" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F1A33" font-weight="600" text-anchor="start">compute_pivot()</text><text x="324" y="162" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">the one engine; it also judges what</text><text x="324" y="179" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">an import brings in (D370)</text><rect x="40" y="268" width="560" height="130" rx="10" fill="#EEF8F5" stroke="#13917F" stroke-width="1.2"/><text x="54" y="292" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F1A33" font-weight="600" text-anchor="start">pivot_exchange.py (new)</text><text x="54" y="312" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">FilePivot: name, source range, target range, fields, totals, filters, labels</text><text x="54" y="329" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">written_pivots(model) -> FilePivot list + losses; sheet_cells(): the grid as plain cells</text><text x="54" y="346" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">adopt_pivots(model, found) -> losses: labels derived from the file's own words,</text><text x="54" y="363" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">  source name found or made, pivot put in, engine run, cells compared, else rolled back</text><rect x="620" y="268" width="230" height="130" rx="10" fill="#FFFFFF" stroke="#D6CFE4" stroke-width="1.2"/><text x="634" y="292" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F1A33" font-weight="600" text-anchor="start">_unwritten.py</text><text x="634" y="312" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">facet 'pivots': definition + grid</text><text x="634" y="329" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">written in a fresh file,</text><text x="634" y="346" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">reported as 'pivot-table' when a</text><text x="634" y="363" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">kept file's pivot changed (D371)</text><rect x="870" y="268" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#D6CFE4" stroke-width="1.2"/><text x="884" y="292" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F1A33" font-weight="600" text-anchor="start">losses (claudia_odf_io)</text><text x="884" y="312" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">pivot-table + detail:</text><text x="884" y="329" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">external-source, data-model,</text><text x="884" y="346" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">calculated-field, grouping,</text><text x="884" y="363" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">slicer, pivot-chart, show-as,</text><text x="884" y="380" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">top-n, sort, room, different</text><rect x="40" y="438" width="330" height="120" rx="10" fill="#FBF3EF" stroke="#B5472A" stroke-width="1.2"/><text x="54" y="462" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F1A33" font-weight="600" text-anchor="start">ods_pivots.py (new)</text><text x="54" y="482" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">FilePivot &lt;-> table:data-pilot-table</text><text x="54" y="499" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">source-cell-range, fields by orientation,</text><text x="54" y="516" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">grand-total, filters as hidden members</text><text x="54" y="533" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">element goes after database-ranges</text><rect x="390" y="438" width="360" height="120" rx="10" fill="#FBF3EF" stroke="#B5472A" stroke-width="1.2"/><text x="404" y="462" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F1A33" font-weight="600" text-anchor="start">xlsx_pivots.py (new)</text><text x="404" y="482" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">FilePivot &lt;-> pivotTableDefinition + cache</text><text x="404" y="499" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">writes cache definition and records, rowItems/colItems,</text><text x="404" y="516" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">rels, content types, refreshOnLoad; reads them back</text><text x="404" y="533" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">add_pivot_table (the D147 spike) is not joined yet: tech debt</text><rect x="770" y="438" width="310" height="120" rx="10" fill="#FFFFFF" stroke="#D6CFE4" stroke-width="1.2"/><text x="784" y="462" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F1A33" font-weight="600" text-anchor="start">ods.py  xlsx.py  xlsx_read.py</text><text x="784" y="482" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">fresh export: pivot grid written as cells</text><text x="784" y="499" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">import: adopt after the cells are read</text><text x="784" y="516" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">patch: a kept file's pivot stays as it is</text><rect x="40" y="606" width="330" height="60" rx="10" fill="#FFFFFF" stroke="#D6CFE4" stroke-width="1.2"/><text x="56" y="630" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#1F1A33" font-weight="500" text-anchor="start">content.xml  (office:spreadsheet)</text><text x="56" y="650" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">data-pilot-tables after database-ranges</text><rect x="390" y="606" width="360" height="60" rx="10" fill="#FFFFFF" stroke="#D6CFE4" stroke-width="1.2"/><text x="406" y="630" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#1F1A33" font-weight="500" text-anchor="start">xl/pivotTables, xl/pivotCache, workbook.xml</text><text x="406" y="650" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">LibreOffice and Excel compute it again on load</text><rect x="770" y="606" width="310" height="60" rx="10" fill="#FFFFFF" stroke="#D6CFE4" stroke-width="1.2"/><text x="786" y="630" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#1F1A33" font-weight="500" text-anchor="start">Excel- or LibreOffice-made pivots</text><text x="786" y="650" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6580" font-weight="400" text-anchor="start">a pivot is live only if the cells equal</text><line x1="270" y1="218" x2="270" y2="266" stroke="#13917F" stroke-width="2" marker-end="url(#a13917F)"/><text x="278" y="248" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#13917F" font-weight="400" text-anchor="start">write</text><line x1="435" y1="218" x2="435" y2="266" stroke="#B5472A" stroke-width="2" marker-end="url(#aB5472A)"/><text x="443" y="248" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#B5472A" font-weight="400" text-anchor="start">engine</text><line x1="700" y1="218" x2="590" y2="266" stroke="#13917F" stroke-width="2" marker-end="url(#a13917F)"/><line x1="270" y1="398" x2="270" y2="436" stroke="#13917F" stroke-width="2" marker-end="url(#a13917F)"/><text x="278" y="424" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#13917F" font-weight="400" text-anchor="start">FilePivot</text><line x1="480" y1="398" x2="520" y2="436" stroke="#13917F" stroke-width="2" marker-end="url(#a13917F)"/><line x1="260" y1="558" x2="260" y2="604" stroke="#13917F" stroke-width="2" marker-end="url(#a13917F)"/><line x1="620" y1="558" x2="620" y2="604" stroke="#13917F" stroke-width="2" marker-end="url(#a13917F)"/><line x1="120" y1="604" x2="120" y2="560" stroke="#B5472A" stroke-width="2" marker-end="url(#aB5472A)"/><text x="128" y="590" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#B5472A" font-weight="400" text-anchor="start">read</text><line x1="450" y1="604" x2="450" y2="560" stroke="#B5472A" stroke-width="2" marker-end="url(#aB5472A)"/><text x="458" y="590" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#B5472A" font-weight="400" text-anchor="start">read</text></svg>