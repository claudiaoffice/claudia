<svg viewBox="0 0 1400 880" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<rect x="0" y="0" width="1400" height="880" fill="#f3f1ea"/>
<text x="40" y="44" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start">claudia — export, import and the record of what leaves the document, proposed (E2.9; D1270, D1271, D1272)</text>
<text x="40" y="66" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">The Export dialog (the same dialog in all three apps, web and desktop), the confirmation, the print preview line, the Import dialog and the History &amp; Chat rows. Nothing is built until it is agreed.</text>
<rect x="40" y="96" width="420" height="744" rx="14" fill="#fbfaf8" stroke="#d8d2e6" stroke-width="1"/>
<text x="62" y="130" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#1f1a33" text-anchor="start">A · Export… — one more format</text>
<text x="62" y="150" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">A new format in the list. Only owners can add history and</text>
<text x="62" y="166" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">chat (D1270).</text>
<text x="62" y="192" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f1a33" text-anchor="start">Owner</text>
<rect x="62" y="202" width="376" height="290" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="80" y="232" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start">Export this document</text>
<line x1="62" y1="246" x2="438" y2="246" stroke="#e3dfee" stroke-width="1"/>
<text x="80" y="268" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">This saves “plan” to this computer in the format you</text>
<text x="80" y="284" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">pick.</text>
<text x="80" y="306" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#1f1a33" text-anchor="start">Save as</text>
<rect x="80" y="314" width="340" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="92" y="333.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Claudia, unencrypted (JSON in a zip)</text>
<text x="404" y="333.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">▾</text>
<rect x="80" y="372" width="16" height="16" rx="4" fill="#13917f" stroke="#13917f" stroke-width="1"/>
<text x="88" y="385" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">✓</text>
<text x="106" y="385" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Include history and chat</text>
<text x="106" y="403" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">Owners only. Hidden lines are included. Without it</text>
<text x="106" y="418" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">the file holds the content as it is now.</text>
<rect x="232" y="446" width="78" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="271.0" y="465.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="middle">Cancel</text>
<rect x="320" y="446" width="100" height="30" rx="6" fill="#1f1a33"/>
<text x="370.0" y="465.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#f7f3ec" text-anchor="middle">Export…</text>
<text x="62" y="534" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f1a33" text-anchor="start">Editor or viewer</text>
<rect x="62" y="544" width="376" height="270" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="80" y="574" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start">Export this document</text>
<line x1="62" y1="588" x2="438" y2="588" stroke="#e3dfee" stroke-width="1"/>
<text x="80" y="610" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">This saves “plan” to this computer in the format you</text>
<text x="80" y="626" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">pick.</text>
<text x="80" y="648" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#1f1a33" text-anchor="start">Save as</text>
<rect x="80" y="656" width="340" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="92" y="675.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Claudia, unencrypted (JSON in a zip)</text>
<text x="404" y="675.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">▾</text>
<text x="80" y="714" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">The file holds the content as it is now. History and</text>
<text x="80" y="730" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">chat can only be exported by owners.</text>
<rect x="232" y="768" width="78" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="271.0" y="787.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="middle">Cancel</text>
<rect x="320" y="768" width="100" height="30" rx="6" fill="#1f1a33"/>
<text x="370.0" y="787.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#f7f3ec" text-anchor="middle">Export…</text>
<rect x="490" y="96" width="420" height="744" rx="14" fill="#fbfaf8" stroke="#d8d2e6" stroke-width="1"/>
<text x="512" y="130" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#1f1a33" text-anchor="start">B · Before it is saved, and printing</text>
<text x="512" y="150" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">The unencrypted file asks once. Printing and PDF say in one</text>
<text x="512" y="166" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">line that they are recorded (D1270, D1271).</text>
<rect x="512" y="192" width="376" height="340" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="530" y="222" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start">Save without protection?</text>
<line x1="512" y1="236" x2="888" y2="236" stroke="#e3dfee" stroke-width="1"/>
<text x="530" y="260" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">The file will not be protected by a password.</text>
<circle cx="538" cy="288" r="3" fill="#b3841a"/>
<text x="550" y="292" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Anyone who gets the file can read it.</text>
<circle cx="538" cy="315" r="3" fill="#b3841a"/>
<text x="550" y="319" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">The export is recorded in the document: who,</text>
<text x="550" y="338" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">when and what.</text>
<circle cx="538" cy="361" r="3" fill="#b3841a"/>
<text x="550" y="365" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Claudia cannot tell whether someone copies</text>
<text x="550" y="384" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">from the screen.</text>
<rect x="632" y="486" width="78" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="671.0" y="505.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="middle">Cancel</text>
<rect x="720" y="486" width="150" height="30" rx="6" fill="#1f1a33"/>
<text x="795.0" y="505.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#f7f3ec" text-anchor="middle">Export unprotected</text>
<text x="512" y="572" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f1a33" text-anchor="start">Print preview and PDF</text>
<rect x="512" y="584" width="376" height="150" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<rect x="512" y="584" width="376" height="44" rx="12" fill="#f4f1fa"/>
<rect x="512" y="608" width="376" height="20" rx="0" fill="#f4f1fa"/>
<text x="530" y="612" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">Print preview · 6 pages</text>
<rect x="722" y="596" width="70" height="24" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="757" y="612" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1f1a33" text-anchor="middle">Print…</text>
<rect x="798" y="596" width="80" height="24" rx="6" fill="#1f1a33"/>
<text x="838" y="612" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#f7f3ec" text-anchor="middle">Save PDF…</text>
<line x1="512" y1="628" x2="888" y2="628" stroke="#e3dfee" stroke-width="1"/>
<text x="530" y="658" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Printing and saving a PDF are recorded in the</text>
<text x="530" y="674" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">document's history: who, when and how many pages.</text>
<text x="530" y="700" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">It is written when the file is saved or the page is sent,</text>
<text x="530" y="715" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">not when the preview opens.</text>
<rect x="940" y="96" width="420" height="744" rx="14" fill="#fbfaf8" stroke="#d8d2e6" stroke-width="1"/>
<text x="962" y="130" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#1f1a33" text-anchor="start">C · Coming back in, and the record</text>
<text x="962" y="150" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Import knows the zip by its first entry (D1272). Owners and</text>
<text x="962" y="166" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">editors see the rows (D1271).</text>
<rect x="962" y="192" width="376" height="372" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="980" y="222" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start">Import a file</text>
<line x1="962" y1="236" x2="1338" y2="236" stroke="#e3dfee" stroke-width="1"/>
<rect x="980" y="240" width="340" height="52" rx="8" fill="#f4f1fa" stroke="#e3dfee" stroke-width="1"/>
<text x="994" y="260" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">plan.claudia-export.zip</text>
<text x="994" y="276" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">A Claudia export, made by anna on 18 Nov 2026</text>
<text x="994" y="288" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#1f1a33" text-anchor="start"></text>
<text x="980" y="318" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#1f1a33" text-anchor="start">Name of the new document</text>
<rect x="980" y="326" width="340" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="992" y="345.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">plan</text>
<text x="980" y="372" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#1f1a33" text-anchor="start">Your name</text>
<rect x="980" y="380" width="160" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="992" y="399.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">tobi</text>
<text x="1160" y="372" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#1f1a33" text-anchor="start">Password</text>
<rect x="1160" y="380" width="160" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="1172" y="399.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">••••••••</text>
<rect x="980" y="430" width="340" height="69" rx="8" fill="#f4f1fa" stroke="#e3dfee" stroke-width="1"/>
<rect x="980" y="430" width="4" height="69" rx="2" fill="#5b4bc4"/>
<text x="996" y="452" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">You become the owner of the new document. The</text>
<text x="996" y="469" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">people named in its history are not given access;</text>
<text x="996" y="486" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">their names stay in the history as former people.</text>
<rect x="1142" y="518" width="78" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="1181.0" y="537.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="middle">Cancel</text>
<rect x="1230" y="518" width="90" height="30" rx="6" fill="#1f1a33"/>
<text x="1275.0" y="537.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#f7f3ec" text-anchor="middle">Import</text>
<text x="962" y="598" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f1a33" text-anchor="start">What owners and editors see in the dock</text>
<rect x="962" y="610" width="376" height="196" rx="14" fill="#1f1a33"/>
<text x="982" y="640" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f7f3ec" text-anchor="start">History &amp; Chat</text>
<text x="1102" y="640" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="400" fill="#a9a3bd" text-anchor="start">Help</text>
<rect x="976" y="662" width="348" height="28" rx="7" fill="#2a2444"/>
<circle cx="990" cy="676" r="4" fill="#a9a3bd"/>
<text x="1002" y="680" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#cfc9e3" text-anchor="start">anna</text>
<text x="1046" y="680" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="400" fill="#a9a3bd" text-anchor="start">exported as Word · content</text>
<text x="1316" y="680" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="400" fill="#a9a3bd" text-anchor="end">14:02</text>
<rect x="976" y="696" width="348" height="28" rx="7" fill="#2a2444"/>
<circle cx="990" cy="710" r="4" fill="#a9a3bd"/>
<text x="1002" y="714" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#cfc9e3" text-anchor="start">tobi</text>
<text x="1046" y="714" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="400" fill="#a9a3bd" text-anchor="start">saved a PDF · 6 pages</text>
<text x="1316" y="714" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="400" fill="#a9a3bd" text-anchor="end">14:10</text>
<rect x="976" y="730" width="348" height="28" rx="7" fill="#2a2444"/>
<circle cx="990" cy="744" r="4" fill="#a9a3bd"/>
<text x="1002" y="748" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="600" fill="#cfc9e3" text-anchor="start">anna</text>
<text x="1046" y="748" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="400" fill="#a9a3bd" text-anchor="start">exported unprotected · all parts</text>
<text x="1316" y="748" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="400" fill="#a9a3bd" text-anchor="end">14:15</text>
<text x="982" y="780" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#a9a3bd" text-anchor="start">Muted, one line each. Not undoable, not redactable.</text>
<text x="40" y="866" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">Printing and PDF are reported by the client (the layout runs in the browser or the shell), so these two rows record what Claudia's own screens did; they cannot see a screenshot or the system's own “print to PDF”.</text>
</svg>
