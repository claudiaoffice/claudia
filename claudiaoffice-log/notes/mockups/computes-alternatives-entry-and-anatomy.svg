<text x="704.0" y="552.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#1F1A33" text-anchor="start">Not an Excel array</text>
<text x="704.0" y="569.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#1F1A33" text-anchor="start">In =formulas, {1,2,3} stays Excel’s array constant. Alternatives only</text>
<text x="704.0" y="586.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#1F1A33" text-anchor="start">count as the whole content of an input cell. SUM(B3) runs once per</text>
<text x="704.0" y="603.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#1F1A33" text-anchor="start">alternative; it does not add them up.</text>
<text x="704.0" y="630.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#1F1A33" text-anchor="start">Same for everyone</text>
<text x="704.0" y="647.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#1F1A33" text-anchor="start">Alternatives are part of the document; the server computes the</text>
<text x="704.0" y="664.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#1F1A33" text-anchor="start">outcomes, so all users see identical results.</text>
<text x="704.0" y="691.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#1F1A33" text-anchor="start">Export to .xlsx / .ods</text>
<text x="704.0" y="708.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#1F1A33" text-anchor="start">The file holds the first alternative everywhere, so the Excel chain</text>
<text x="704.0" y="725.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#1F1A33" text-anchor="start">stays consistent; the others go into a cell note.</text>
