<text x="260" y="300" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">calls</text>
<line x1="520" y1="310" x2="430" y2="280" stroke="#6e6880" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="500" y="296" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">sets the way back</text>
