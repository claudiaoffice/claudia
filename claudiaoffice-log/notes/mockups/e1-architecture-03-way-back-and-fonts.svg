<text x="864" y="582" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">asks</text>
<line x1="450" y1="590" x2="480" y2="590" stroke="#6e6880" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
