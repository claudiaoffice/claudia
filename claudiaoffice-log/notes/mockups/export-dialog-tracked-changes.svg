<text x="556" y="402" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">2 open suggestions, dated when proposed, signed.</text>
<line x1="530" y1="428" x2="870" y2="428" stroke="#e3dfee" stroke-width="1"/>
<text x="530" y="454" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">Saved. The file does not hold:</text>
