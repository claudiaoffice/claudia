<text x="383" y="526" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Export</text>
<rect x="512" y="196" width="376" height="520" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="530" y="226" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start">Export this document</text>
