<text x="530" y="266" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">This saves “plan” to this computer, in the format you pick.</text>
<text x="530" y="282" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">History and chat are not included.</text>
