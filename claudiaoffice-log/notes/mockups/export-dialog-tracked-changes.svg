<text x="1304" y="341" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">▾</text>
<rect x="980" y="372" width="16" height="16" rx="4" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
