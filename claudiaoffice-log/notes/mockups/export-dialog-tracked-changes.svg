<text x="1006" y="402" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">2 open suggestions would be written as tracked changes.</text>
<rect x="1162" y="506" width="78" height="30" rx="6" fill="#fff" stroke="#c9c2dc" stroke-width="1"/>
<text x="1201" y="526" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="middle">Cancel</text>
