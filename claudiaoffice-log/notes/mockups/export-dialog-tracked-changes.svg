<text x="548" y="486" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1f1a33" text-anchor="start">Who typed which words (3 paragraphs)</text>
<text x="548" y="501" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">OpenDocument text has no place to keep it.</text>
<circle cx="536" cy="521" r="3" fill="#b3841a"/>
<text x="548" y="525" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1f1a33" text-anchor="start">Style “remark” is saved as body text</text>
<text x="548" y="540" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">Rename it to Body text, Heading or Quote to keep it.</text>
<circle cx="536" cy="560" r="3" fill="#b3841a"/>
<text x="548" y="564" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1f1a33" text-anchor="start">1 remark is not in the file</text>
