<text x="1283" y="526" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Export</text>
<text x="40" y="786" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">Wording of the codes: authorship · style · remark · suggestion (switched off) · suggestion-anchor (no longer matches its text) — each one sentence, a count, and what to do if there is something to do.</text>
