<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<rect x="0" y="0" width="1400" height="800" rx="0" fill="#f3f1ea"/>
<text x="40" y="44" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start">claudia — File ▸ Export…, with tracked changes and what the file could not hold, proposed (E12.6, D411)</text>
<text x="40" y="66" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">ExportFormatDialog.vue. The server side exists (export_office(format, tracked_changes), losses); nothing of this screen is built until it is agreed.</text>
<rect x="40" y="96" width="420" height="660" rx="14" fill="#fbfaf8" stroke="#d8d2e6" stroke-width="1"/>
<text x="62" y="130" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#1f1a33" text-anchor="start">A · Text, OpenDocument chosen</text>
<text x="62" y="150" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">The checkbox is there for Word and OpenDocument, and only</text>
<text x="62" y="166" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">when the document has open suggestions.</text>
<rect x="490" y="96" width="420" height="660" rx="14" fill="#fbfaf8" stroke="#d8d2e6" stroke-width="1"/>
<text x="512" y="130" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#1f1a33" text-anchor="start">B · After Export: the loss list</text>
<text x="512" y="150" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">The list appears once the file is saved. Nothing lost → one</text>
<text x="512" y="166" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">calm line instead.</text>
<rect x="940" y="96" width="420" height="660" rx="14" fill="#fbfaf8" stroke="#d8d2e6" stroke-width="1"/>
<text x="962" y="130" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#1f1a33" text-anchor="start">C · Text, Word chosen</text>
<text x="962" y="150" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Same checkbox. The server gives no loss list for Word yet,</text>
<text x="962" y="166" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">so none is shown.</text>
<rect x="62" y="196" width="376" height="380" rx="12" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
<text x="80" y="226" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start">Export this document</text>
