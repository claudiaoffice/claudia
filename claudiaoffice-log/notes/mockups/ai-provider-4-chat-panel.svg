<text x="40" y="705" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">• A and B: the ai's row names who answers: 'Claude · remote' (filled, remote) or 'Qwen2.5-7B · this server' (outlined, here). The same badge is on the settings page and in the connection hover.</text>
<text x="40" y="725" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">• B: without the server's approval or the owner's consent the question goes to the local model, or to the stand-in when there is none, and the chat says so under the answer. It is not an error.</text>
<text x="40" y="745" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">• C: one sentence for every cause, '&lt;AI type&gt; is not available at the moment. The administrator can see why.' No fallback to another provider; she asks again when she likes.</text>
<text x="40" y="765" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">• D: the stop message is 'Stopped: Claude was switched off.' What was already sent cannot be taken back; the point is that nothing more is. The next question in that document goes to the local model or the stand-in.</text>
</svg>
