<title id="t">claudia — the History &amp; Chat panel with Claude: allowed, not allowed, not available, switched off</title><desc id="d">Four panels: Claude answers and is marked remote; Claude is not allowed in this document so the local model answers and says so; Claude is not available; the owner switches Claude off while a question runs.</desc>
