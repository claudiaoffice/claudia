<text x="40" y="44" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start">E3.13 bugs 1 + 2 — where an importer finds a file&#x27;s font, and where it goes</text>
<text x="40" y="66" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Each importer looks where the program that wrote the file looks; the model keeps the name the file says (css_family), never a stand-in; exporters write that name back (file_font).</text>
