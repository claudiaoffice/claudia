<text x="80" y="695" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#1f1a33" text-anchor="start">Format ▸ Fonts… shows this list again at any time. When the real font arrives (here, on the server, or in PowerPoint after export), it is used</text>
