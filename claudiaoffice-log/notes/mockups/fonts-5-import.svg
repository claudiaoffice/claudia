<text x="992" y="141" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">The file has been read, so its fonts are known before anything is</text>
<text x="992" y="158.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">shown. The step appears only when a font is not here as the file</text>
<text x="992" y="175.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">has it; otherwise opening goes straight on, as now.</text>
<circle cx="971" cy="212.0" r="11" fill="#5b4bc4"/>
<text x="971" y="216.2" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<text x="992" y="217.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Two names on every line</text>
<text x="992" y="237.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">The family the file asks for, and the stand-in, set in its own face</text>
<text x="992" y="254.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">with a sample, so the change of look is seen here and not</text>
<text x="992" y="271.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">discovered on slide 12.</text>
<circle cx="971" cy="308.0" r="11" fill="#5b4bc4"/>
<text x="971" y="312.2" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<text x="992" y="313.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">How close, in three words</text>
<text x="992" y="333.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">The same font · Same widths (lines break the same, letters</text>
<text x="992" y="350.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">differ) · Other widths (layout changes). For creates and</text>
<text x="992" y="367.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">computes the last also says where: the slides whose text no</text>
<text x="992" y="384.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">longer fits its box, the columns that no longer fit their text.</text>
<circle cx="971" cy="421.0" r="11" fill="#5b4bc4"/>
<text x="971" y="425.2" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
<text x="992" y="426.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Getting the real font</text>
<text x="992" y="446.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">Desktop clients see the computer&#x27;s own fonts: Use Arial from</text>
<text x="992" y="463.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">this computer adds it to the document (board 4C). On a server</text>
<text x="992" y="480.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">with the open-font list, missing open fonts are fetched before</text>
<text x="992" y="497.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">this step.</text>
<circle cx="971" cy="534.0" r="11" fill="#5b4bc4"/>
<text x="971" y="538.2" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
<text x="992" y="539.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Choosing a better stand-in</text>
<text x="992" y="559.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">When no font has the same widths, the person picks one, with</text>
<text x="992" y="576.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">the count of changed slides updated as she picks. The choice is</text>
<text x="992" y="593.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">a logged command and changes nothing but the stand-in.</text>
