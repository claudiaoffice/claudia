<svg viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">claudia — Name &amp; describe…: one dialog for every thing</title><desc id="d">The Edit menu entry and the right-click entry, the dialog for a picture with its name field, and the refusal when a name is taken.</desc>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f1a33" flood-opacity="0.18"/></filter></defs>
<rect width="1400" height="820" fill="#f3f1ea"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">claudia — Name &amp; describe…: one dialog, with a name field, in all three apps (E1.13, D1304, D1317)</text>
<text x="40" y="66" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">For your review. Same entry, key (Ctrl+Alt+D), words and dialog in composes, computes and creates, in the web app and in both desktop clients. Fixes the bug of size 2: today's dialog has no name field.</text>
