<svg viewBox="0 0 1400 840" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">claudia — View ▸ Back where I was, with the History &amp; Chat panel folded away</title><desc id="d">A composes window without the panel; the View menu open with the new entry, enabled; and the same menu when there is nothing to go back to.</desc>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f1a33" flood-opacity="0.18"/></filter></defs>
<rect width="1400" height="840" fill="#f3f1ea"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">claudia — View ▸ Back where I was (Ctrl+Shift+B), for when the panel is folded away (D1312)</text>
<text x="40" y="66" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Same place, words and key in composes, computes and creates, in the web app and both desktop clients. On a Mac the key is Cmd+Shift+B.</text>
<rect x="40" y="100" width="820" height="40" rx="0" fill="#f7f3ec" stroke="#d8d2e6" stroke-width="1"/>
<text x="56" y="125" font-size="13.5" font-weight="500" fill="#1f1a33" text-anchor="start">File</text>
<text x="128" y="125" font-size="13.5" font-weight="500" fill="#1f1a33" text-anchor="start">Edit</text>
<rect x="192" y="106" width="58" height="28" rx="6" fill="#ece8f8"/>
<text x="200" y="125" font-size="13.5" font-weight="500" fill="#1f1a33" text-anchor="start">View</text>
<text x="272" y="125" font-size="13.5" font-weight="500" fill="#1f1a33" text-anchor="start">Insert</text>
<text x="362" y="125" font-size="13.5" font-weight="500" fill="#1f1a33" text-anchor="start">Format</text>
<text x="452" y="125" font-size="13.5" font-weight="500" fill="#1f1a33" text-anchor="start">Tools</text>
<text x="533" y="125" font-size="13.5" font-weight="500" fill="#1f1a33" text-anchor="start">Help</text>
<rect x="40" y="140" width="820" height="430" rx="0" fill="#ece8df"/>
<rect x="120" y="170" width="560" height="380" rx="4" fill="#fff" stroke="#d8d2e6" stroke-width="1" filter="url(#sh)"/>
<text x="146" y="204" font-size="17" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">Terms of the licence</text>
<text x="146" y="238" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Termination needs written notice of three months</text>
<text x="146" y="256" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">to the end of a calendar quarter.</text>
<rect x="134" y="276" width="532" height="60" rx="6" fill="#5B4BC4" opacity="0.12"/>
<rect x="132" y="274" width="536" height="64" rx="8" fill="none" stroke="#5B4BC4" stroke-width="2.5"/>
<text x="146" y="294" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Cancellation: the licence ends when either party</text>
<text x="146" y="312" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">gives three months' notice in writing.</text>
<rect x="60" y="520" width="176" height="32" rx="16" fill="#fff" stroke="#d8d2e6" stroke-width="1" filter="url(#sh)"/>
<text x="148.0" y="541" font-size="12.5" font-weight="600" fill="#3f31a0" text-anchor="middle">← Back where I was</text>
<rect x="40" y="570" width="820" height="26" rx="0" fill="#fff" stroke="#d8d2e6" stroke-width="1"/>
<text x="52" y="588" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Page 41 · centred on “Cancellation” · History &amp; Chat is hidden (Ctrl+Alt+H)</text>
<rect x="880" y="140" width="330" height="290" rx="10" fill="#fff" stroke="#d8d2e6" stroke-width="1" filter="url(#sh)"/>
<text x="898" y="172" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">Show Who Wrote What</text>
<text x="1196" y="172" font-size="12" font-weight="400" fill="#6e6880" text-anchor="end">Ctrl+Alt+U</text>
<text x="898" y="204" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">History and Chat</text>
<text x="1196" y="204" font-size="12" font-weight="400" fill="#6e6880" text-anchor="end">Ctrl+Alt+H</text>
<text x="898" y="236" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">Replay History…</text>
<text x="1196" y="236" font-size="12" font-weight="400" fill="#6e6880" text-anchor="end">Ctrl+Alt+Z</text>
<line x1="890" y1="254" x2="1200" y2="254" stroke="#d8d2e6" stroke-width="1"/>
<rect x="886" y="260" width="318" height="30" rx="6" fill="#ece8f8"/>
<text x="898" y="280" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Back where I was</text>
<text x="1196" y="280" font-size="12" font-weight="400" fill="#1f1a33" text-anchor="end">Ctrl+Shift+B</text>
<line x1="890" y1="298" x2="1200" y2="298" stroke="#d8d2e6" stroke-width="1"/>
<text x="898" y="324" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">Dark Mode</text>
<text x="1196" y="324" font-size="12" font-weight="400" fill="#6e6880" text-anchor="end">Ctrl+Shift+Alt+D</text>
<text x="898" y="356" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">Page</text>
<text x="1196" y="356" font-size="12" font-weight="400" fill="#6e6880" text-anchor="end">Ctrl+Alt+P</text>
<text x="880" y="126" font-size="12" font-weight="600" fill="#1f1a33" text-anchor="start">View, with a way back waiting</text>
<text x="880" y="462" font-size="12" font-weight="600" fill="#1f1a33" text-anchor="start">View, with nothing to go back to: the entry is greyed</text>
<rect x="880" y="472" width="330" height="230" rx="10" fill="#fff" stroke="#d8d2e6" stroke-width="1" filter="url(#sh)"/>
<text x="898" y="504" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">Show Who Wrote What</text>
<text x="1196" y="504" font-size="12" font-weight="400" fill="#6e6880" text-anchor="end">Ctrl+Alt+U</text>
<text x="898" y="536" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">History and Chat</text>
<text x="1196" y="536" font-size="12" font-weight="400" fill="#6e6880" text-anchor="end">Ctrl+Alt+H</text>
<text x="898" y="568" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">Replay History…</text>
<text x="1196" y="568" font-size="12" font-weight="400" fill="#6e6880" text-anchor="end">Ctrl+Alt+Z</text>
<text x="898" y="600" font-size="13" font-weight="400" fill="#a39db8" text-anchor="start">Back where I was</text>
<text x="1196" y="600" font-size="12" font-weight="400" fill="#a39db8" text-anchor="end">Ctrl+Shift+B</text>
<text x="40" y="640" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">What this asks of the build:</text>
<text x="40" y="663" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">•  The entry sits in View, after Replay History…, in a group of its own, in all three apps (menus workbook: a new row,</text>
<text x="56" y="682" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">with the web, Linux, Windows and macOS key columns filled, added in the same patch as the manifest). It is greyed when</text>
<text x="56" y="701" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">there is nothing to go back to.</text>
<text x="40" y="724" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">•  Ctrl+Shift+B is free in all three apps (Ctrl+Alt+B is Text Box, Ctrl+Shift+Alt+B is Number Headings). Chrome and</text>
<text x="56" y="743" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Firefox use it for the bookmarks bar; a page can take the key, but I will try it in both before the manifest is</text>
<text x="56" y="762" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">changed, and name the fallback (Ctrl+Alt+Shift+B is taken) if it fails.</text>
</svg>
