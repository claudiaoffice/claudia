<title id="t">claudia - E7.12 architecture 1: where the catalog files, the checker and the sources go</title><desc id="d">Class and file diagram: one action-catalog.md per app and one for the core, the checker in scripts with Entry, Seen and Catalog, the existing sources it reads, the test and the generated overview.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6880"/></marker></defs>
<rect width="1500" height="900" fill="#f3f1ea"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">E7.12 architecture 1 — the catalog is data next to each app; one checker reads it against the running code</text>
<text x="40" y="66" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Nothing is loaded at run time. The model still gets its requests from MODEL_METHODS and its recipes from skills.md; the catalog only checks that they agree with what a person can do.</text>
