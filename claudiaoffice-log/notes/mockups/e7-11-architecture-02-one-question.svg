<text x="585.0" y="146" font-size="10.5" fill="#fff" text-anchor="middle">«AsyncEngine»</text>
<text x="585.0" y="164" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">AiRouter</text>
