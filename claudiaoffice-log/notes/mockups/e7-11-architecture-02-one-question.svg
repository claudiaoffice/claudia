<text x="1074" y="112" font-size="12" font-weight="600" fill="#6e6880">claudia_core</text>
<rect x="40" y="850" width="26" height="12" rx="3" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/><text x="74" y="860" font-size="11.5" fill="#6e6880">exists today</text>
<rect x="170" y="850" width="26" height="12" rx="3" fill="#fff" stroke="#d6477a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="204" y="860" font-size="11.5" fill="#6e6880">new in E7.11 (dashed)</text>
<text x="360" y="860" font-size="11.5" fill="#6e6880">bold coloured line = new or changed member of an existing class · «…» = kind · open triangle = is a</text>
<rect x="50" y="130" width="300" height="90" rx="6" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/>
<path d="M50 136 a6 6 0 0 1 6 -6 h288 a6 6 0 0 1 6 6 v18 h-300 z" fill="#5b4bc4"/>
<text x="200.0" y="150" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">Assistant</text>
<text x="62" y="170" font-size="11.5" font-weight="400" fill="#1f1a33" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">engine: Engine | AsyncEngine</text>
<text x="62" y="188" font-size="11.5" font-weight="600" fill="#d6477a" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">_say(asker, text, via=None)</text>
<text x="62" y="206" font-size="11.5" font-weight="600" fill="#d6477a" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">  -&gt; post_chat(..., via=via)</text>
