<text x="432" y="202" font-size="11.5" font-weight="600" fill="#d6477a" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">consent: AiConsent   (this document, live)</text>
<text x="432" y="220" font-size="11.5" font-weight="600" fill="#d6477a" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">local, remote: ModelEngine</text>
<text x="432" y="238" font-size="11.5" font-weight="600" fill="#d6477a" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">standin: Engine  (the app&#x27;s own)</text>
<text x="432" y="256" font-size="11.5" font-weight="600" fill="#d6477a" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">plan_async(task) -&gt; [Say]</text>
<text x="432" y="274" font-size="11.5" font-weight="400" fill="#6e6880" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">  decide, delegate, never fall back</text>
<text x="432" y="292" font-size="11.5" font-weight="400" fill="#6e6880" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">  Withdrawn -&gt; &quot;Stopped: …&quot;</text>
<text x="432" y="310" font-size="11.5" font-weight="400" fill="#6e6880" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">  ProviderError -&gt; the one sentence</text>
