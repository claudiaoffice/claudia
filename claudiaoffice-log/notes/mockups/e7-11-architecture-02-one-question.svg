<path d="M50 416 a6 6 0 0 1 6 -6 h288 a6 6 0 0 1 6 6 v18 h-300 z" fill="#5b4bc4"/>
<text x="200.0" y="430" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">HostedDocument</text>
<text x="62" y="450" font-size="11.5" font-weight="400" fill="#1f1a33" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">assistant: Assistant</text>
<text x="62" y="468" font-size="11.5" font-weight="600" fill="#d6477a" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">ai_consent: AiConsent</text>
<text x="62" y="486" font-size="11.5" font-weight="400" fill="#6e6880" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">  read from the document&#x27;s sealed</text>
<text x="62" y="504" font-size="11.5" font-weight="400" fill="#6e6880" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">  consent list when it opens</text>
<rect x="1080" y="130" width="370" height="90" rx="6" fill="#fff" stroke="#5b4bc4" stroke-width="1.6"/>
<path d="M1080 136 a6 6 0 0 1 6 -6 h358 a6 6 0 0 1 6 6 v18 h-370 z" fill="#5b4bc4"/>
<text x="1265.0" y="150" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">ChatRecord</text>
<text x="1092" y="170" font-size="11.5" font-weight="400" fill="#1f1a33" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">number, author, to, text, time, at</text>
<text x="1092" y="188" font-size="11.5" font-weight="600" fill="#d6477a" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">via: Via | None</text>
<text x="1092" y="206" font-size="11.5" font-weight="400" fill="#6e6880" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">  optional: old files load unchanged</text>
<rect x="1080" y="260" width="370" height="140" rx="6" fill="#fff" stroke="#d6477a" stroke-width="1.6" stroke-dasharray="6 4"/>
<path d="M1080 266 a6 6 0 0 1 6 -6 h358 a6 6 0 0 1 6 6 v32 h-370 z" fill="#d6477a"/>
<text x="1265.0" y="276" font-size="10.5" fill="#fff" text-anchor="middle">«frozen»</text>
<text x="1265.0" y="294" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">Via</text>
<text x="1092" y="314" font-size="11.5" font-weight="600" fill="#d6477a" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">provider: &quot;claude&quot;|&quot;local&quot;|&quot;stand-in&quot;</text>
<text x="1092" y="332" font-size="11.5" font-weight="600" fill="#d6477a" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">label: str   remote: bool</text>
<text x="1092" y="350" font-size="11.5" font-weight="600" fill="#d6477a" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">note: str | None</text>
<text x="1092" y="368" font-size="11.5" font-weight="400" fill="#6e6880" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">  &quot;Claude is not allowed in this</text>
<text x="1092" y="386" font-size="11.5" font-weight="400" fill="#6e6880" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">   document …&quot; / &quot;no answer was made&quot;</text>
