<text x="585.0" y="574" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">GatedRunner</text>
<text x="432" y="594" font-size="11.5" font-weight="600" fill="#d6477a" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">runner: Answerer</text>
