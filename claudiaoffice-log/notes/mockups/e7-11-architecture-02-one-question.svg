<path d="M750 624.0 L800 594.4" fill="none" stroke="#6e6880" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="775.0" y="605.2" font-size="11" fill="#6e6880" text-anchor="middle">raises</text>
<path d="M552.0 680 L552.0 720" fill="none" stroke="#6e6880" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="602.0" y="696.0" font-size="11" fill="#6e6880" text-anchor="middle">still_allowed asks</text>
<path d="M200.0 518 L200.0 620" fill="none" stroke="#6e6880" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="200.0" y="565.0" font-size="11" fill="#6e6880" text-anchor="middle">owns</text>
<path d="M1265.0 220 L1265.0 260" fill="none" stroke="#6e6880" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="1060" y="440" width="410" height="174" rx="6" fill="#fdf3e6" stroke="#f2a057"/>
<text x="1070" y="459" font-size="11.5" fill="#1f1a33">One question, in order:</text>
<text x="1070" y="475" font-size="11.5" fill="#1f1a33">1. the router asks the desk: decide(this document&#x27;s consent)</text>
<text x="1070" y="491" font-size="11.5" fill="#1f1a33">   -&gt; Decision (who answers, and why, if not Claude)</text>
<text x="1070" y="507" font-size="11.5" fill="#1f1a33">2. it hands the question to that engine: stand-in, local or remote</text>
<text x="1070" y="523" font-size="11.5" fill="#1f1a33">3. every round of the model loop goes through the gate;</text>
<text x="1070" y="539" font-size="11.5" fill="#1f1a33">   consent withdrawn -&gt; Withdrawn, nothing more is sent</text>
<text x="1070" y="555" font-size="11.5" fill="#1f1a33">4. the outcome becomes a Say with its Via:</text>
<text x="1070" y="571" font-size="11.5" fill="#1f1a33">   answered / not allowed (answered locally) /</text>
<text x="1070" y="587" font-size="11.5" fill="#1f1a33">   ProviderError (one sentence, no fallback) / stopped</text>
<text x="1070" y="603" font-size="11.5" fill="#1f1a33">5. desk.health records the failure or clears it</text>
<rect x="1060" y="690" width="410" height="110" rx="6" fill="#f0edf9" stroke="#b9b2d1"/>
<text x="1070" y="709" font-size="11.5" fill="#1f1a33">Why here, and not elsewhere:</text>
<text x="1070" y="725" font-size="11.5" fill="#1f1a33">Assistant is provider-agnostic: the engine already is the seam,</text>
<text x="1070" y="741" font-size="11.5" fill="#1f1a33">so the router is an engine. The runner must not learn about</text>
<text x="1070" y="757" font-size="11.5" fill="#1f1a33">documents; the engine loop must not learn about providers.</text>
<text x="1070" y="773" font-size="11.5" fill="#1f1a33">The gate sits where rounds happen, so a switch-off stops a</text>
<text x="1070" y="789" font-size="11.5" fill="#1f1a33">question before its next round, as the owner agreed.</text>
</svg>
