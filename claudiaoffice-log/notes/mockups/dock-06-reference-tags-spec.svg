<text x="58.0" y="128.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F1A33" text-anchor="start" >How it reads in the chat</text>
<text x="58.0" y="160.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#6B6580" text-anchor="start" letter-spacing="0.8">NOT PICKED</text>
<text x="58.0" y="178.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6B6580" text-anchor="start" >Typed “#1” and carried on: stays plain</text>
<text x="58.0" y="192.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6B6580" text-anchor="start" >text, no tag.</text>
<text x="290.0" y="182.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F1A33" text-anchor="start" >it looks like #1 to me</text>
<text x="58.0" y="226.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#6B6580" text-anchor="start" letter-spacing="0.8">TAG</text>
<text x="58.0" y="244.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6B6580" text-anchor="start" >Picked from the list or by clicking an</text>
<text x="58.0" y="258.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6B6580" text-anchor="start" >object. Glyph shows the kind.</text>
<text x="290.0" y="248.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F1A33" text-anchor="start" >see</text>
<rect x="314.7" y="233.5" width="78.7" height="20.0" rx="10" fill="#E8E4F2" stroke="#CFC8E6" stroke-width="1" />
<rect x="322.7" y="238.5" width="12.0" height="10.0" rx="2" fill="none" stroke="#5B4BC4" stroke-width="1.3" />
