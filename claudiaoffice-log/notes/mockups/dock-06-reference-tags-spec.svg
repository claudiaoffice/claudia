<text x="405.2" y="380.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3F31A0" text-anchor="start" >so what</text>
<rect x="386.0" y="392.0" width="214.0" height="40.0" rx="8" fill="#1F1A33" filter="url(#sh2)"/>
<text x="398.0" y="409.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="start" >figure 1 · image on Method</text>
<text x="398.0" y="424.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#B9B0F0" text-anchor="start" >Click to go there</text>
<text x="58.0" y="442.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#6B6580" text-anchor="start" letter-spacing="0.8">PRESSED</text>
<text x="58.0" y="460.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6B6580" text-anchor="start" >The tag you just clicked, while the</text>
<text x="58.0" y="474.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6B6580" text-anchor="start" >view moves.</text>
<rect x="290.0" y="449.5" width="78.7" height="20.0" rx="10" fill="#5B4BC4" stroke="#3F31A0" stroke-width="1" />
<rect x="298.0" y="454.5" width="12.0" height="10.0" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.3" />
<circle cx="301.5" cy="458.0" r="1.2" fill="#FFFFFF" />
<path d="M299,463.5 L303,459.5 L306,462.5 L308,460.5 L309.5,462.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="316.0" y="464.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#FFFFFF" text-anchor="start" >figure 1</text>
<text x="58.0" y="508.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#6B6580" text-anchor="start" letter-spacing="0.8">TARGET DELETED</text>
<text x="58.0" y="526.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6B6580" text-anchor="start" >Grey and struck through. Click: replay</text>
<text x="58.0" y="540.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6B6580" text-anchor="start" >jumps to the last moment it existed.</text>
<rect x="290.0" y="515.5" width="78.7" height="20.0" rx="10" fill="#EFEDE8" stroke="#DAD4C8" stroke-width="1" />
<rect x="298.0" y="520.5" width="12.0" height="10.0" rx="2" fill="none" stroke="#8A8597" stroke-width="1.3" />
<circle cx="301.5" cy="524.0" r="1.2" fill="#8A8597" />
<path d="M299,529.5 L303,525.5 L306,528.5 L308,526.5 L309.5,528.5" fill="none" stroke="#8A8597" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="316.0" y="530.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#8A8597" text-anchor="start" >figure 1</text>
<line x1="316.0" y1="525.5" x2="359.7" y2="525.5" stroke="#8A8597" stroke-width="1.2" />
<rect x="40.0" y="586.0" width="600.0" height="104.0" rx="12" fill="#FFFFFF" stroke="#DAD4C8" stroke-width="1" />
<text x="58.0" y="612.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F1A33" text-anchor="start" >Renaming</text>
<text x="58.0" y="632.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start" >A tag points at the object, not at its text. After a rename it shows the new name; on hover it says</text>
<text x="58.0" y="648.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start" >“named figure 1 when written”. Replaying history shows the name it had at that moment.</text>
<rect x="660.0" y="100.0" width="580.0" height="330.0" rx="12" fill="#FFFFFF" stroke="#DAD4C8" stroke-width="1" />
<text x="678.0" y="128.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F1A33" text-anchor="start" >How a tag is made</text>
<circle cx="690.0" cy="154.0" r="11" fill="#E8E4F2" />
<text x="690.0" y="158.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3F31A0" text-anchor="middle" >1</text>
<text x="712.0" y="158.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1F1A33" text-anchor="start" >Type #</text>
<text x="712.0" y="175.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B6580" text-anchor="start" >A list opens: what is selected, what is on the viewport, and the tabs.</text>
<circle cx="690.0" cy="198.5" r="11" fill="#E8E4F2" />
<text x="690.0" y="202.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3F31A0" text-anchor="middle" >2</text>
<text x="712.0" y="202.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1F1A33" text-anchor="start" >Keep typing to filter</text>
<text x="712.0" y="219.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B6580" text-anchor="start" >“#fig” leaves figure 1. Spaces stay in the filter because names contain spaces.</text>
<circle cx="690.0" cy="243.0" r="11" fill="#E8E4F2" />
<text x="690.0" y="247.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3F31A0" text-anchor="middle" >3</text>
<text x="712.0" y="247.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1F1A33" text-anchor="start" >Pick it</text>
<text x="712.0" y="264.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B6580" text-anchor="start" >Enter, Tab or click in the list. Or click the object itself in the viewport: its name goes in.</text>
<circle cx="690.0" cy="287.5" r="11" fill="#E8E4F2" />
<text x="690.0" y="291.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3F31A0" text-anchor="middle" >4</text>
<text x="712.0" y="291.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1F1A33" text-anchor="start" >Or just don’t</text>
<text x="712.0" y="308.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B6580" text-anchor="start" >If nothing matches, or Esc, or you click elsewhere: the text stays plain.</text>
<rect x="678.0" y="344.0" width="544.0" height="44.0" rx="10" fill="#FBFAF7" stroke="#CFC8E6" stroke-width="1.2" />
<text x="692.0" y="372.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#C8553D" text-anchor="start" >@bret</text>
<text x="732.3" y="372.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F1A33" text-anchor="start" >sorry but</text>
<rect x="789.4" y="357.5" width="78.7" height="20.0" rx="10" fill="#E8E4F2" stroke="#CFC8E6" stroke-width="1" />
<rect x="797.4" y="362.5" width="12.0" height="10.0" rx="2" fill="none" stroke="#5B4BC4" stroke-width="1.3" />
<circle cx="800.9" cy="366.0" r="1.2" fill="#5B4BC4" />
<path d="M798.380859375,371.5 L802.380859375,367.5 L805.380859375,370.5 L807.380859375,368.5 L808.880859375,370.5" fill="none" stroke="#5B4BC4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="815.4" y="372.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3F31A0" text-anchor="start" >figure 1</text>
<text x="873.0" y="372.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F1A33" text-anchor="start" >on</text>
<text x="891.4" y="372.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#5B4BC4" text-anchor="start" >#Me</text>
<rect x="919.6" y="357.0" width="1.6" height="19.0" rx="0" fill="#5B4BC4" />
<text x="678.0" y="408.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6B6580" text-anchor="start" >In the composer a tag is one unit: Backspace selects it, a second Backspace deletes it.</text>
<rect x="660.0" y="446.0" width="580.0" height="244.0" rx="12" fill="#FFFFFF" stroke="#DAD4C8" stroke-width="1" />
<text x="678.0" y="474.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1F1A33" text-anchor="start" >Rules and access</text>
<circle cx="682.0" cy="494.0" r="2.5" fill="#5B4BC4" />
<text x="694.0" y="498.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start" >Clicking a tag moves anyone’s view to the object: it is centred when the view is zoomed or</text>
<text x="694.0" y="513.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start" >scrolled, the tab switches when needed, the object is tinted for a few seconds. A “Back to …”</text>
<text x="694.0" y="529.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start" >chip undoes the move.</text>
<circle cx="682.0" cy="545.5" r="2.5" fill="#5B4BC4" />
<text x="694.0" y="549.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start" >Names stay unique per document, so a tag is never ambiguous. In the list, things on other tabs</text>
<text x="694.0" y="565.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start" >say where they are.</text>
<circle cx="682.0" cy="581.5" r="2.5" fill="#5B4BC4" />
<text x="694.0" y="585.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start" >Menu: Edit ▸ Reference selection in chat, Ctrl+Alt+R ¹, puts the selected object in the composer.</text>
<circle cx="682.0" cy="602.0" r="2.5" fill="#5B4BC4" />
<text x="694.0" y="606.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start" >BITV: the list is a combobox with listbox; a tag is a button, “Go to figure 1, image on Method”;</text>
<text x="694.0" y="621.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start" >kind is shown by glyph and shape, not colour alone; reduced motion jumps instead of</text>
<text x="694.0" y="637.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1F1A33" text-anchor="start" >animating.</text>
<text x="678.0" y="680.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6B6580" text-anchor="start" >¹ proposed</text>
<text x="40.0" y="722.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F1A33" text-anchor="start" >Open points</text>
<text x="40.0" y="742.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B6580" text-anchor="start" >1  Are names unique per document today? If a slide and an object may share a name, the list needs a kind label next to every entry.</text>
<text x="40.0" y="760.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B6580" text-anchor="start" >2  Tag the dead object: should the jump go to the last moment it existed (needs the replay), or only explain?</text>
<text x="40.0" y="778.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B6580" text-anchor="start" >3  Tags in exported documents and chat: proposal is plain “#figure 1” text, since no other format has references to named things.</text></svg>