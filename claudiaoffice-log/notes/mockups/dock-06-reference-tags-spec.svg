<rect x="298.0" y="370.5" width="12.0" height="10.0" rx="2" fill="none" stroke="#5B4BC4" stroke-width="1.3" />
<circle cx="301.5" cy="374.0" r="1.2" fill="#5B4BC4" />
<path d="M299,379.5 L303,375.5 L306,378.5 L308,376.5 L309.5,378.5" fill="none" stroke="#5B4BC4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="316.0" y="380.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3F31A0" text-anchor="start" >figure 1</text>
<text x="372.2" y="380.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F1A33" text-anchor="start" ></text>
<rect x="379.2" y="365.5" width="81.8" height="20.0" rx="10" fill="#E8E4F2" stroke="#5B4BC4" stroke-width="1" />
<rect x="376.7" y="363.0" width="86.8" height="25.0" rx="12.5" fill="none" stroke="#1F1A33" stroke-width="1.6" />
<rect x="387.2" y="370.0" width="12.0" height="8.0" rx="2.5" fill="none" stroke="#5B4BC4" stroke-width="1.3" />
