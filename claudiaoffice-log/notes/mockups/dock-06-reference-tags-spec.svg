<text x="58.0" y="358.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#6B6580" text-anchor="start" letter-spacing="0.8">HOVER / KEYBOARD FOCUS</text>
<text x="58.0" y="376.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6B6580" text-anchor="start" >Tooltip says what and where; focus</text>
<text x="58.0" y="390.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#6B6580" text-anchor="start" >ring for keyboard.</text>
