<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="Referencing: how tags look, how they are made, and what they do"><title>Referencing: how tags look, how they are made, and what they do</title><desc>Tag anatomy and states, typing rules, and open points.</desc><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1F1A33" flood-opacity="0.20"/></filter><filter id="sh2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1F1A33" flood-opacity="0.16"/></filter></defs><rect x="0.0" y="0.0" width="1280.0" height="800.0" rx="0" fill="#F7F3EC" />
