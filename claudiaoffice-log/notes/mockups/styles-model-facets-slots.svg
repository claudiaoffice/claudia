<text x="1246" y="162" font-size="10.5" font-weight="400" fill="#6b6780" text-anchor="end">kind words</text>
<rect x="770" y="188" width="490" height="46" rx="9" fill="#fbfaf7" stroke="#d9d5e8" stroke-width="1.2"/>
<text x="784" y="216" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">text box · words</text>
<rect x="970" y="201" width="81" height="22" rx="11" fill="#e1f0ea" stroke="#d9d5e8"/>
<text x="1010.5" y="216" font-size="11.5" font-weight="500" fill="#1f1a33" text-anchor="middle">Paragraph</text>
<rect x="1057" y="201" width="46" height="22" rx="11" fill="#e8e4fb" stroke="#d9d5e8"/>
<text x="1080.0" y="216" font-size="11.5" font-weight="500" fill="#1f1a33" text-anchor="middle">Text</text>
<text x="1246" y="216" font-size="10.5" font-weight="400" fill="#6b6780" text-anchor="end">kind words</text>
<rect x="770" y="242" width="490" height="46" rx="9" fill="#fbfaf7" stroke="#d9d5e8" stroke-width="1.2"/>
<text x="784" y="270" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">text box · box</text>
<rect x="970" y="255" width="39" height="22" rx="11" fill="#fbe9d6" stroke="#d9d5e8"/>
<text x="989.5" y="270" font-size="11.5" font-weight="500" fill="#1f1a33" text-anchor="middle">Box</text>
<text x="1246" y="270" font-size="10.5" font-weight="400" fill="#6b6780" text-anchor="end">kind box</text>
<rect x="770" y="296" width="490" height="46" rx="9" fill="#fbfaf7" stroke="#d9d5e8" stroke-width="1.2"/>
<text x="784" y="324" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">shape · outline</text>
<rect x="970" y="309" width="67" height="22" rx="11" fill="#f9e0e6" stroke="#d9d5e8"/>
<text x="1003.5" y="324" font-size="11.5" font-weight="500" fill="#1f1a33" text-anchor="middle">Outline</text>
<text x="1246" y="324" font-size="10.5" font-weight="400" fill="#6b6780" text-anchor="end">kind outline</text>
<rect x="770" y="350" width="490" height="46" rx="9" fill="#fbfaf7" stroke="#d9d5e8" stroke-width="1.2"/>
<text x="784" y="378" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">shape · label</text>
<rect x="970" y="363" width="81" height="22" rx="11" fill="#e1f0ea" stroke="#d9d5e8"/>
<text x="1010.5" y="378" font-size="11.5" font-weight="500" fill="#1f1a33" text-anchor="middle">Paragraph</text>
