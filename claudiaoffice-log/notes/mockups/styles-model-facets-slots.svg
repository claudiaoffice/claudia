<svg viewBox="0 0 1320 920" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b6780"/></marker></defs>
<rect width="1320" height="920" fill="#f3f1ea"/>
<text x="40" y="46" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">The style model: facets, slots and bundles</text>
<text x="40" y="70" font-size="12.5" font-weight="400" fill="#6b6780" text-anchor="start">D300–D310 · one model for composes, computes and creates · what is stored is one property bag in CSS notation; the facets say what each property means and how it is drawn or exported</text>
<rect x="40" y="100" width="270" height="330" rx="12" fill="#fbfaf7" stroke="#d9d5e8" stroke-width="1.2"/>
<text x="60" y="128" font-size="14" font-weight="600" fill="#1f1a33" text-anchor="start">Style (a named bundle)</text>
<text x="60" y="158" font-size="12.5" font-weight="600" fill="#5b4bc4" text-anchor="start">id, name, purpose</text>
<text x="60" y="174" font-size="11.5" font-weight="400" fill="#6b6780" text-anchor="start"></text>
<text x="60" y="196" font-size="12.5" font-weight="600" fill="#5b4bc4" text-anchor="start">based_on</text>
<text x="60" y="212" font-size="11.5" font-weight="400" fill="#6b6780" text-anchor="start">parent; stores only differences</text>
<text x="60" y="234" font-size="12.5" font-weight="600" fill="#5b4bc4" text-anchor="start">kind</text>
<text x="60" y="250" font-size="11.5" font-weight="400" fill="#6b6780" text-anchor="start">words | box | outline</text>
<text x="60" y="272" font-size="12.5" font-weight="600" fill="#5b4bc4" text-anchor="start">properties</text>
<text x="60" y="288" font-size="11.5" font-weight="400" fill="#6b6780" text-anchor="start">CSS notation, one bag</text>
<text x="60" y="310" font-size="12.5" font-weight="600" fill="#5b4bc4" text-anchor="start">to_name</text>
<text x="60" y="326" font-size="11.5" font-weight="400" fill="#6b6780" text-anchor="start">provisional name (D75)</text>
<text x="60" y="372" font-size="11.5" font-weight="400" fill="#6b6780" text-anchor="start">Named by what it is for (D62, D309):</text>
<text x="60" y="388" font-size="11.5" font-weight="400" fill="#6b6780" text-anchor="start">one purpose = one bundle.</text>
<text x="60" y="412" font-size="11" font-weight="400" fill="#6b6780" text-anchor="start">Calling it “CSS” is shorthand: see facets.</text>
<text x="370" y="118" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Facets — every property is in exactly one (D303)</text>
<rect x="370" y="134" width="330" height="134" rx="10" fill="#e8e4fb" stroke="#d9d5e8" stroke-width="1.2"/>
<text x="386" y="158" font-size="13.5" font-weight="600" fill="#1f1a33" text-anchor="start">Text</text>
<text x="386" y="178" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">font-family  font-size</text>
<text x="386" y="194" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">font-weight  font-style</text>
<text x="386" y="210" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">text-decoration  color</text>
<text x="386" y="226" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">letter-spacing  word-spacing</text>
<text x="386" y="258" font-size="10.5" font-weight="400" fill="#6b6780" text-anchor="start">web: CSS · docx/odf: run props · typeset</text>
<rect x="370" y="278" width="330" height="118" rx="10" fill="#e1f0ea" stroke="#d9d5e8" stroke-width="1.2"/>
<text x="386" y="302" font-size="13.5" font-weight="600" fill="#1f1a33" text-anchor="start">Paragraph</text>
<text x="386" y="322" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">text-align  line-height</text>
<text x="386" y="338" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">margin-top/right/bottom/left</text>
<text x="386" y="354" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">(indent, wrap later)</text>
<text x="386" y="386" font-size="10.5" font-weight="400" fill="#6b6780" text-anchor="start">web: CSS · docx/odf: paragraph props</text>
<rect x="370" y="406" width="330" height="134" rx="10" fill="#fbe9d6" stroke="#d9d5e8" stroke-width="1.2"/>
<text x="386" y="430" font-size="13.5" font-weight="600" fill="#1f1a33" text-anchor="start">Box</text>
<text x="386" y="450" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">background-color</text>
<text x="386" y="466" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">border-top/right/bottom/left</text>
<text x="386" y="482" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">padding-top/right/bottom/left</text>
<text x="386" y="498" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">vertical-align  white-space  (D307)</text>
<text x="386" y="530" font-size="10.5" font-weight="400" fill="#6b6780" text-anchor="start">web: CSS · xlsx cell format · odf cell/frame</text>
<rect x="370" y="550" width="330" height="86" rx="10" fill="#f9e0e6" stroke="#d9d5e8" stroke-width="1.2"/>
<text x="386" y="574" font-size="13.5" font-weight="600" fill="#1f1a33" text-anchor="start">Outline</text>
<text x="386" y="594" font-size="11.5" font-weight="400" fill="#1f1a33" text-anchor="start">fill  stroke  stroke-width</text>
<text x="386" y="626" font-size="10.5" font-weight="400" fill="#6b6780" text-anchor="start">web: SVG attributes · pptx/odf line+fill</text>
<path d="M310 260 L368 260" stroke="#6b6780" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="770" y="118" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Slots — each reads only the facets it understands (D304)</text>
