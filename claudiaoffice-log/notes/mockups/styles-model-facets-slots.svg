<text x="784" y="540" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">picture</text>
<text x="1246" y="540" font-size="10.5" font-weight="400" fill="#6b6780" text-anchor="end">kind box (nothing read)</text>
<path d="M702 260 L768 260" stroke="#6b6780" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="40" y="452" width="310" height="320" rx="12" fill="#fbfaf7" stroke="#d9d5e8" stroke-width="1.2"/>
<text x="60" y="480" font-size="13.5" font-weight="600" fill="#1f1a33" text-anchor="start">Rules that follow</text>
<text x="60" y="506" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start">A slot ignores facets it does not read.</text>
<text x="60" y="528" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start">One style per container text: no per-word</text>
<text x="60" y="550" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start">formatting (D306). Inline marks (Emphasis,</text>
<text x="60" y="572" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start">Strong, Code) are a later, opt-in exception.</text>
<text x="60" y="594" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start">“Change the box only” deviates one slot (D309).</text>
<text x="60" y="616" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start">Text boxes use Box; Outline is for shapes (D310).</text>
<text x="60" y="638" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start">Cells use the same Box style as a text box</text>
<text x="60" y="660" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start">and the same text properties as composes (D307).</text>
<text x="60" y="682" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start">No migration before release (D308).</text>
<rect x="370" y="646" width="330" height="250" rx="12" fill="#fbfaf7" stroke="#d9d5e8" stroke-width="1.2"/>
<text x="390" y="674" font-size="13.5" font-weight="600" fill="#1f1a33" text-anchor="start">Where a style is applied</text>
<text x="390" y="700" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="ui-monospace, Menlo, monospace">ObjectBody.style      → the container slot</text>
<text x="390" y="722" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="ui-monospace, Menlo, monospace">  (box, or outline for a shape)</text>
<text x="390" y="744" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="ui-monospace, Menlo, monospace">Paragraph.style      → the words slot</text>
<text x="390" y="766" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="ui-monospace, Menlo, monospace">  (text box, shape label, cell words)</text>
<text x="390" y="788" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="ui-monospace, Menlo, monospace">Composes paragraph   → one slot, Box +</text>
<text x="390" y="810" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="ui-monospace, Menlo, monospace">  Paragraph + Text</text>
<text x="390" y="832" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start"></text>
<text x="390" y="854" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start">The menu offers a style only where its</text>
<text x="390" y="876" font-size="11.8" font-weight="400" fill="#1f1a33" text-anchor="start">kind fits the slot (D305).</text>
<text x="770" y="610" font-size="13.5" font-weight="600" fill="#1f1a33" text-anchor="start">Built-ins after the split (D310)</text>
<text x="770" y="636" font-size="11.6" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="ui-monospace, Menlo, monospace">body-text, headings, quote, definition — words</text>
<text x="770" y="660" font-size="11.6" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="ui-monospace, Menlo, monospace">plain-shape — outline</text>
<text x="770" y="684" font-size="11.6" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="ui-monospace, Menlo, monospace">shape-label — words</text>
<text x="770" y="708" font-size="11.6" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="ui-monospace, Menlo, monospace">plain-box (text box default) — box</text>
<text x="770" y="732" font-size="11.6" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="ui-monospace, Menlo, monospace">plain-image — box</text>
</svg>