<text x="1246" y="432" font-size="10.5" font-weight="400" fill="#6b6780" text-anchor="end">kind box</text>
<rect x="770" y="458" width="490" height="46" rx="9" fill="#fbfaf7" stroke="#d9d5e8" stroke-width="1.2"/>
<text x="784" y="486" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">cell · words</text>
