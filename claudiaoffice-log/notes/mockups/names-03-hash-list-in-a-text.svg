<svg viewBox="0 0 1400 780" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">claudia — the # list in a text: the paragraphs in view, and everything with a name of its own</title><desc id="d">The chat box with the # list open next to a text; first as it opens, then filtered while typing.</desc>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f1a33" flood-opacity="0.18"/></filter></defs>
<rect width="1400" height="780" fill="#f3f1ea"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">claudia — pointing at a paragraph: the # list in a long text (D551, D1310, D1311)</text>
<text x="40" y="66" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Every paragraph has a name from the start. A list of hundreds would be useless, so it shows what is in view plus what a person named; typing searches the whole text.</text>
<rect x="40" y="100" width="420" height="460" rx="4" fill="#fff" stroke="#d8d2e6" stroke-width="1" filter="url(#sh)"/>
<text x="66" y="134" font-size="17" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">Introduction</text>
<text x="66" y="168" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Both parties keep a copy of this agreement</text>
<text x="66" y="186" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">and of every change made to it.</text>
<rect x="54" y="206" width="392" height="60" rx="6" fill="#5B4BC4" opacity="0.12"/>
<rect x="52" y="204" width="396" height="64" rx="8" fill="none" stroke="#5B4BC4" stroke-width="2.5"/>
<text x="66" y="224" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">The terms apply from the day both parties have</text>
<text x="66" y="242" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">signed and run for twelve months.</text>
<text x="66" y="280" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Payment is due within thirty days of the invoice.</text>
<text x="66" y="298" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Interest on late payment is charged at 5 %.</text>
<text x="66" y="336" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">Notices are sent in writing to the address given</text>
<text x="66" y="354" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">above, by post or by e-mail.</text>
<text x="250" y="590" font-size="12" font-weight="500" fill="#6e6880" text-anchor="middle">the writer's view: page 4 of 41</text>
<rect x="500" y="100" width="420" height="560" rx="10" fill="#fbfaf7" stroke="#d8d2e6" stroke-width="1"/>
<text x="516" y="126" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">History &amp; Chat</text>
<rect x="516" y="560" width="388" height="40" rx="8" fill="#fff" stroke="#8d86a8" stroke-width="1"/>
<text x="528" y="585" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">#</text>
<rect x="516" y="150" width="388" height="396" rx="8" fill="#fff" stroke="#8d86a8" stroke-width="1" filter="url(#sh)"/>
<text x="530" y="170" font-size="11" font-weight="600" fill="#6e6880" text-anchor="start">Named by you, and headings (always offered)</text>
<rect x="522" y="180" width="376" height="28" rx="6" fill="#ece8f8"/>
<text x="532" y="199" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">heading</text>
<text x="598" y="199" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Introduction</text>
<text x="532" y="229" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">heading</text>
<text x="598" y="229" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="start">Introduction (2)</text>
<text x="724.4" y="229" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">· page 12</text>
<text x="532" y="259" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">paragraph</text>
<text x="598" y="259" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="start">Terms</text>
<text x="643.0" y="259" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">· page 4</text>
<text x="532" y="289" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">picture</text>
<text x="598" y="289" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="start">Figure 1</text>
<text x="665.2" y="289" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">· page 9</text>
<text x="530" y="314" font-size="11" font-weight="600" fill="#6e6880" text-anchor="start">In view (page 4)</text>
<text x="532" y="343" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">paragraph</text>
<text x="598" y="343" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="start">Paragraph 11</text>
<text x="694.8" y="343" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">· Both parties keep a copy of this…</text>
<text x="532" y="373" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">paragraph</text>
<text x="598" y="373" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="start">Paragraph 13</text>
<text x="694.8" y="373" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">· Payment is due within thirty…</text>
<text x="532" y="403" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">paragraph</text>
<text x="598" y="403" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="start">Paragraph 14</text>
<text x="694.8" y="403" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">· Notices are sent in writing…</text>
<text x="530" y="530" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">Type to search the whole text · ↑ ↓ · Enter · Esc</text>
<rect x="940" y="100" width="420" height="560" rx="10" fill="#fbfaf7" stroke="#d8d2e6" stroke-width="1"/>
<text x="956" y="126" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">History &amp; Chat</text>
<rect x="956" y="560" width="388" height="40" rx="8" fill="#fff" stroke="#8d86a8" stroke-width="1"/>
<text x="968" y="585" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start">#ter</text>
<rect x="956" y="150" width="388" height="396" rx="8" fill="#fff" stroke="#8d86a8" stroke-width="1" filter="url(#sh)"/>
<text x="970" y="170" font-size="11" font-weight="600" fill="#6e6880" text-anchor="start">Found anywhere in the text</text>
<rect x="962" y="180" width="376" height="28" rx="6" fill="#ece8f8"/>
<text x="972" y="199" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">paragraph</text>
<text x="1038" y="199" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="start">Terms</text>
<text x="1083.0" y="199" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">· page 4</text>
<text x="972" y="229" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">paragraph</text>
<text x="1038" y="229" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="start">Paragraph 212</text>
<text x="1142.2" y="229" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">· …the terms of the licence…</text>
<text x="972" y="259" font-size="11" font-weight="400" fill="#6e6880" text-anchor="start">paragraph</text>
<text x="1038" y="259" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="start">Paragraph 305</text>
<text x="1142.2" y="259" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">· …determined by the court…</text>
<text x="970" y="530" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">3 matches in the whole text · names and first words</text>
<text x="40" y="700" font-size="12.5" font-weight="600" fill="#1f1a33" text-anchor="start">How it works:</text>
<text x="40" y="723" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">•  Opening the list shows what is in the writer's view as “Paragraph 12 · first words of the text”, so that a generic name always comes with something to recognise it by.</text>
<text x="40" y="746" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">•  Everything a person named, and every heading, is always in the list, wherever it is. Two headings with the same title: “Introduction” and “Introduction (2)”.</text>
<text x="40" y="769" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">•  Typing searches the whole text, by name and by the first words; the part that matches is what is chosen. Picking one puts a tag in the message; the tag stores the id</text>
<text x="56" y="788" font-size="12.5" font-weight="400" fill="#1f1a33" text-anchor="start">and shows the current name.</text>
</svg>
