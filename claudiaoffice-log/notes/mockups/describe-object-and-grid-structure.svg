<svg viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">claudia — Describe Object… and the structure of the grid for a screen reader</title>
<desc id="d">Left: the Format menu entry, the dialog with description, counter and the Decorative box. Right: the grid's rows, cells and headers with their ARIA roles and the active cell named by aria-activedescendant.</desc>
<rect width="1400" height="760" fill="#f3f1ea"/>
<text x="40" y="44" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#1f1a33">claudia — alt text, decorative objects and the grid's structure (BITV 1.1.1, 1.3.1, 4.1.2; UX-02)</text>
<text x="40" y="66" font-size="12.5" fill="#6e6880">Built before this was agreed: please confirm or change. Same dialog, menu entry (Ctrl+Alt+D) and words in computes and creates.</text>

<!-- Format menu -->
<rect x="40" y="100" width="300" height="250" rx="10" fill="#ffffff" stroke="#d8d2e6"/>
<text x="58" y="126" font-size="12" font-weight="600" fill="#6e6880">Format</text>
<text x="58" y="154" font-size="13" fill="#1f1a33">Apply Style…</text>
<text x="58" y="180" font-size="13" fill="#1f1a33">Edit This Style…</text><text x="322" y="180" font-size="12" fill="#6e6880" text-anchor="end">Shift+F10</text>
<text x="58" y="206" font-size="13" fill="#1f1a33">All Styles…</text>
<text x="58" y="232" font-size="13" fill="#1f1a33">List</text>
<line x1="50" y1="246" x2="330" y2="246" stroke="#d8d2e6"/>
<text x="58" y="270" font-size="13" fill="#1f1a33">Colours…</text>
<line x1="50" y1="284" x2="330" y2="284" stroke="#d8d2e6"/>
<rect x="46" y="294" width="288" height="30" rx="6" fill="#ece8f8"/>
<text x="58" y="314" font-size="13" font-weight="600" fill="#1f1a33">Describe Object…</text><text x="322" y="314" font-size="12" fill="#1f1a33" text-anchor="end">Ctrl+Alt+D</text>
<text x="58" y="342" font-size="11.5" fill="#6e6880">Disabled with nothing selected, and for a viewer.</text>

<!-- Dialog -->
<rect x="40" y="380" width="460" height="340" rx="14" fill="#ffffff" stroke="#8d86a8" stroke-width="1.5"/>
<text x="64" y="414" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600" fill="#1f1a33">Describe object</text>
<text x="64" y="442" font-size="12.5" fill="#1f1a33">Description (read aloud to someone who cannot see it)</text>
<rect x="64" y="452" width="412" height="96" rx="8" fill="#ffffff" stroke="#8d86a8"/>
<text x="76" y="476" font-size="13" fill="#1f1a33">The logo of the club: a red hawk over two blue waves</text>
<text x="64" y="568" font-size="12" fill="#6e6880">52 of 300 characters</text>
<rect x="64" y="584" width="16" height="16" rx="3" fill="#ffffff" stroke="#8d86a8"/>
<text x="90" y="597" font-size="13" fill="#1f1a33">Decorative: only for looks, a screen reader skips it</text>
<text x="64" y="624" font-size="12" fill="#9a2f4a">A picture needs words, or "Decorative" (shown only when empty).</text>
<rect x="64" y="650" width="90" height="36" rx="18" fill="#4b3fb0"/><text x="109" y="673" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Save</text>
<rect x="166" y="650" width="90" height="36" rx="18" fill="#ffffff" stroke="#8d86a8"/><text x="211" y="673" font-size="13" fill="#1f1a33" text-anchor="middle">Cancel</text>
<text x="280" y="663" font-size="11.5" fill="#6e6880">Ticking Decorative greys the words out, keeps them,</text>
<text x="280" y="679" font-size="11.5" fill="#6e6880">and sends none; unticking brings them back.</text>

<!-- Grid structure -->
<text x="560" y="110" font-size="14" font-weight="600" fill="#1f1a33">role="grid" · aria-rowcount 10001 · aria-colcount 703 · aria-multiselectable</text>
<rect x="560" y="124" width="800" height="300" rx="8" fill="#ffffff" stroke="#d8d2e6"/>
<rect x="560" y="124" width="60" height="30" fill="#f4f1fa"/>
<text x="590" y="144" font-size="11" fill="#6e6880" text-anchor="middle">aria-hidden</text>
<rect x="620" y="124" width="160" height="30" fill="#f4f1fa" stroke="#d8d2e6"/><text x="700" y="144" font-size="12" font-weight="500" fill="#1f1a33" text-anchor="middle">A</text>
<rect x="780" y="124" width="160" height="30" fill="#f4f1fa" stroke="#d8d2e6"/><text x="860" y="144" font-size="12" font-weight="500" fill="#1f1a33" text-anchor="middle">B</text>
<text x="1140" y="144" font-size="11.5" fill="#4b3fb0">role=row · aria-rowindex 1 · columnheader, aria-colindex 2, 3 …</text>
<rect x="560" y="154" width="60" height="40" fill="#f4f1fa" stroke="#d8d2e6"/><text x="590" y="179" font-size="12" fill="#1f1a33" text-anchor="middle">1</text>
<rect x="620" y="154" width="160" height="40" fill="#ffffff" stroke="#d8d2e6"/><text x="632" y="179" font-size="13" fill="#1f1a33">Rent</text>
<rect x="780" y="154" width="160" height="40" fill="#ffffff" stroke="#d8d2e6"/><text x="792" y="179" font-size="13" fill="#1f1a33">800</text>
<text x="960" y="179" font-size="11.5" fill="#4b3fb0">row 2: rowheader (col 1), gridcell aria-colindex 2, 3 …</text>
<rect x="560" y="194" width="60" height="40" fill="#f4f1fa" stroke="#d8d2e6"/><text x="590" y="219" font-size="12" fill="#1f1a33" text-anchor="middle">2</text>
<rect x="620" y="194" width="160" height="40" fill="#ffffff" stroke="#d8d2e6"/><text x="632" y="219" font-size="13" fill="#1f1a33">Food</text>
<rect x="780" y="194" width="160" height="40" fill="#ffffff" stroke="#d8d2e6"/><text x="792" y="219" font-size="13" fill="#1f1a33">9600</text>
<rect x="780" y="234" width="160" height="40" fill="#ffffff" stroke="#4b3fb0" stroke-width="3"/>
<rect x="560" y="234" width="60" height="40" fill="#f4f1fa" stroke="#d8d2e6"/><text x="590" y="259" font-size="12" fill="#1f1a33" text-anchor="middle">3</text>
<rect x="620" y="234" width="160" height="40" fill="#ffffff" stroke="#d8d2e6"/>
<text x="792" y="259" font-size="13" fill="#9a2f4a">#DIV/0!</text>
<text x="960" y="259" font-size="11.5" fill="#4b3fb0">the active cell: aria-activedescendant points here,</text>
<text x="960" y="275" font-size="11.5" fill="#4b3fb0">even when it is empty, aria-selected="true"</text>
<rect x="560" y="300" width="800" height="110" rx="6" fill="#f4f1fa"/>
<text x="576" y="324" font-size="12.5" font-weight="600" fill="#1f1a33">What a screen reader says on arriving in a cell (aria-label of the active cell only)</text>
<text x="576" y="348" font-size="12.5" fill="#1f1a33">B1, 800   ·   B2, 9600, formula   ·   B3, error #DIV/0!   ·   B5, empty</text>
<text x="576" y="372" font-size="12.5" fill="#1f1a33">After a range is chosen, a polite live region says it once it has settled:</text>
<text x="576" y="392" font-size="12.5" fill="#1f1a33">"A1:B2 selected, 4 cells"  ·  "Column B selected"  ·  "Row 5 selected"  ·  "All cells selected"</text>

<text x="560" y="460" font-size="14" font-weight="600" fill="#1f1a33">Objects on the sheet</text>
<text x="560" y="486" font-size="12.5" fill="#1f1a33">role="img" with the name "Picture: the logo of the club" — or "Picture (no description)", or role="presentation" and aria-hidden for a decoration.</text>
<text x="560" y="510" font-size="12.5" fill="#1f1a33">Ctrl+Alt+PageDown / PageUp step through the objects (the mouse was the only way); Ctrl+Alt+D describes the selected one;</text>
<text x="560" y="534" font-size="12.5" fill="#1f1a33">a selected object is announced as "Selected: …". On a slide the same entry is also in the object's context menu ("Describe…").</text>
<text x="560" y="578" font-size="14" font-weight="600" fill="#1f1a33">Open points</text>
<text x="560" y="604" font-size="12.5" fill="#1f1a33">• Should "Describe…" also open from the Properties dialog of a picture, and from the sheet's context menu on an object?</text>
<text x="560" y="628" font-size="12.5" fill="#1f1a33">• Is Ctrl+Alt+D right for macOS (Cmd+Option+D) and for German keyboards, where AltGr is Ctrl+Alt?</text>
<text x="560" y="652" font-size="12.5" fill="#1f1a33">• Chart tabs have a name only (no description): wanted?</text>
</svg>
