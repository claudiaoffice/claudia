<text x="86" y="194" font-size="12" font-weight="400" fill="#a9a3bd" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace">claudia.example.org</text>
<text x="86" y="212" font-size="12" font-weight="400" fill="#a9a3bd" text-anchor="start">Signed in as anna</text>
