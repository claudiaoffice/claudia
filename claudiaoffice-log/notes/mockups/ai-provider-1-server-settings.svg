<text x="300" y="328" font-size="13" font-weight="600" fill="#6e6880" text-anchor="start">AI provider</text>
<rect x="300" y="338" width="520" height="38" rx="9" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="386.6666666666667" y="362" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="middle">Scripted stand-in</text>
<line x1="473.33333333333337" y1="338" x2="473.33333333333337" y2="376" stroke="#b9b2d1" stroke-width="1"/>
<text x="560.0" y="362" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="middle">Local model</text>
<rect x="646.6666666666667" y="338" width="173.33333333333334" height="38" rx="9" fill="#5b4bc4"/>
<line x1="646.6666666666667" y1="338" x2="646.6666666666667" y2="376" stroke="#b9b2d1" stroke-width="1"/>
<text x="733.3333333333334" y="362" font-size="13" font-weight="500" fill="#f7f3ec" text-anchor="middle">Claude</text>
<text x="300" y="400" font-size="12.5" font-weight="500" fill="#6e6880" text-anchor="start">Provider key</text>
<rect x="300" y="408" width="420" height="38" rx="9" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="314" y="431.5" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace">sk-ant-•••••••••••••••••••• a7Q2</text>
<rect x="732" y="408" width="88" height="38" rx="9" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="776.0" y="431.5" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="middle">Replace</text>
<rect x="830" y="408" width="88" height="38" rx="9" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="874.0" y="431.5" font-size="13" font-weight="500" fill="#9a2f4a" text-anchor="middle">Remove</text>
<text x="300" y="466" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">Kept on this server only. It is never shown again, never sent to a client or into a document.</text>
<text x="300" y="484" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">A key of your Anthropic account. Anthropic bills its use apart from any Claude subscription.</text>
<text x="300" y="512" font-size="12.5" font-weight="500" fill="#6e6880" text-anchor="start">Model</text>
<rect x="300" y="520" width="300" height="38" rx="9" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="314" y="543.5" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace">claude-sonnet-5-5</text>
<rect x="616" y="526" width="80" height="28" rx="14" fill="none" stroke="#b9b2d1" stroke-width="1"/>
<text x="656.0" y="545" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">sonnet-5-5</text>
<rect x="702" y="526" width="67" height="28" rx="14" fill="none" stroke="#b9b2d1" stroke-width="1"/>
<text x="735.5" y="545" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">opus-5-5</text>
<rect x="775" y="526" width="73" height="28" rx="14" fill="none" stroke="#b9b2d1" stroke-width="1"/>
<text x="811.5" y="545" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">haiku-5-5</text>
<rect x="854" y="526" width="73" height="28" rx="14" fill="none" stroke="#b9b2d1" stroke-width="1"/>
<text x="890.5" y="545" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">fable-5-2</text>
<text x="300" y="572" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">Type any model id: the list of models changes faster than this app does.</text>
<text x="300" y="600" font-size="12.5" font-weight="500" fill="#6e6880" text-anchor="start">Longest answer (tokens)</text>
<rect x="300" y="608" width="130" height="38" rx="9" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="314" y="631.5" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace">1024</text>
<text x="514" y="600" font-size="12.5" font-weight="500" fill="#6e6880" text-anchor="start">Timeout (seconds)</text>
<rect x="514" y="608" width="130" height="38" rx="9" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="528" y="631.5" font-size="13" font-weight="400" fill="#1f1a33" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace">60</text>
<circle cx="278" cy="338" r="11" fill="#5b4bc4"/>
<text x="278" y="342.5" font-size="12" font-weight="600" fill="#f7f3ec" text-anchor="middle">2</text>
<circle cx="278" cy="418" r="11" fill="#5b4bc4"/>
<text x="278" y="422.5" font-size="12" font-weight="600" fill="#f7f3ec" text-anchor="middle">3</text>
<rect x="300" y="668" width="640" height="138" rx="12" fill="#fdf3e6" stroke="#f2a057" stroke-width="1.5"/>
<rect x="318" y="688" width="18" height="18" rx="4" fill="#5b4bc4"/>
<path d="M322 697 l3.5 3.5 6.5 -7.5" stroke="#f7f3ec" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="350" y="704" font-size="14" font-weight="600" fill="#1f1a33" text-anchor="start">Document content is sent to Anthropic when someone asks @ai.</text>
<text x="350" y="726" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Documents are encrypted on this server; Claude reads what it is shown in plain text.</text>
<text x="924" y="688" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="end">Confirmed by anna, today 09:12</text>
<line x1="318" y1="742" x2="922" y2="742" stroke="#f0cfa6" stroke-width="1"/>
<text x="318" y="762" font-size="12.5" font-weight="500" fill="#1f1a33" text-anchor="start">This is not enough on its own: the owners of each document must also allow Claude</text>
<text x="318" y="780" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">(Preferences ▸ AI…, off by default). Until they do, @ai in that document uses the</text>
<text x="318" y="796" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">local model or the stand-in, and says so.</text>
<circle cx="278" cy="698" r="11" fill="#5b4bc4"/>
<text x="278" y="702.5" font-size="12" font-weight="600" fill="#f7f3ec" text-anchor="middle">4</text>
<line x1="300" y1="828" x2="940" y2="828" stroke="#d8d2e6" stroke-width="1"/>
<path d="M302 861.0 l4.5 4.5 8.0 -9.0" stroke="#13917f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="326" y="866" font-size="13" font-weight="600" fill="#13917f" text-anchor="start">Test answered in 1.4 s</text>
<text x="326" y="884" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">Apply asks Claude one test question first.</text>
<rect x="770" y="850" width="80" height="38" rx="9" fill="#ffffff" stroke="#b9b2d1" stroke-width="1"/>
<text x="810.0" y="873.5" font-size="13" font-weight="500" fill="#1f1a33" text-anchor="middle">Cancel</text>
<rect x="860" y="850" width="80" height="38" rx="9" fill="#5b4bc4"/>
<text x="900.0" y="873.5" font-size="13" font-weight="500" fill="#f7f3ec" text-anchor="middle">Apply</text>
<circle cx="278" cy="869" r="11" fill="#5b4bc4"/>
<text x="278" y="873.5" font-size="12" font-weight="600" fill="#f7f3ec" text-anchor="middle">5</text>
<text x="992" y="126" font-size="15" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">What the numbers mean</text>
<circle cx="1000" cy="160" r="11" fill="#5b4bc4"/>
<text x="1000" y="164.5" font-size="12" font-weight="600" fill="#f7f3ec" text-anchor="middle">1</text>
<text x="1022" y="165" font-size="13.5" font-weight="600" fill="#1f1a33" text-anchor="start">What is answering</text>
<text x="1022" y="185" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">Always said in words, with the 'remote'</text>
<text x="1022" y="202" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">badge, so the page tells the truth about</text>
<text x="1022" y="219" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">where content goes (D32). Under it, the</text>
<text x="1022" y="236" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">last error and when it happened: the</text>
<text x="1022" y="253" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">place an administrator looks first.</text>
<circle cx="1000" cy="297" r="11" fill="#5b4bc4"/>
<text x="1000" y="301.5" font-size="12" font-weight="600" fill="#f7f3ec" text-anchor="middle">2</text>
<text x="1022" y="302" font-size="13.5" font-weight="600" fill="#1f1a33" text-anchor="start">One switch, three providers</text>
<text x="1022" y="322" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">Stand-in, local model (today's folder,</text>
<text x="1022" y="339" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">device, limits) and Claude. The local</text>
<text x="1022" y="356" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">fields stay as they are, so an old</text>
<text x="1022" y="373" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">settings file loads unchanged.</text>
<circle cx="1000" cy="417" r="11" fill="#5b4bc4"/>
<text x="1000" y="421.5" font-size="12" font-weight="600" fill="#f7f3ec" text-anchor="middle">3</text>
<text x="1022" y="422" font-size="13.5" font-weight="600" fill="#1f1a33" text-anchor="start">The provider key is write-only</text>
<text x="1022" y="442" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">Only its last four characters show</text>
<text x="1022" y="459" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">afterwards. An operator can give it as</text>
<text x="1022" y="476" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">ANTHROPIC_API_KEY or a key file, which</text>
<text x="1022" y="493" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">wins over the saved one (D154).</text>
<circle cx="1000" cy="537" r="11" fill="#5b4bc4"/>
<text x="1000" y="541.5" font-size="12" font-weight="600" fill="#f7f3ec" text-anchor="middle">4</text>
<text x="1022" y="542" font-size="13.5" font-weight="600" fill="#1f1a33" text-anchor="start">Two approvals, not one</text>
<text x="1022" y="562" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">The administrator confirms the sentence;</text>
<text x="1022" y="579" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">it is recorded with who and when. It is</text>
<text x="1022" y="596" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">not enough: the owners of each document</text>
<text x="1022" y="613" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">allow Claude there. The administrator is</text>
<text x="1022" y="630" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">not an owner and cannot open sealed ones.</text>
<circle cx="1000" cy="674" r="11" fill="#5b4bc4"/>
<text x="1000" y="678.5" font-size="12" font-weight="600" fill="#f7f3ec" text-anchor="middle">5</text>
<text x="1022" y="679" font-size="13.5" font-weight="600" fill="#1f1a33" text-anchor="start">Test before apply</text>
<text x="1022" y="699" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">One question through the new provider. A</text>
<text x="1022" y="716" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">refused key or an unreachable API is</text>
<text x="1022" y="733" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">refused here with its reason, not found</text>
<text x="1022" y="750" font-size="12" font-weight="400" fill="#6e6880" text-anchor="start">out by the first person who asks @ai.</text>
<text x="40" y="964" font-size="11.5" font-weight="400" fill="#6e6880" text-anchor="start">State shown: Claude selected and applied. The failures, the unapplied state and the local model's page are on ai-provider-2-settings-states.svg.</text>
</svg>
