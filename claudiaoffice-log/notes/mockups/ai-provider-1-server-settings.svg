<svg viewBox="0 0 1400 970" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">claudia — Server settings ▸ AI: Claude as an AI provider</title><desc id="d">The server settings page for the AI: a switch between the scripted stand-in, the local model and Claude; Claude's provider key, model and limits; the administrator's confirmation; the test before applying.</desc>
<rect x="0" y="0" width="1400" height="970" fill="#f3f1ea"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">claudia — Server settings ▸ AI: Claude as an AI provider, proposed (E7.11)</text>
<text x="40" y="66" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Same shell as AdminShell.vue. The page is the server's own, reached by URL plus the access secret. The page is now called AI (it was AI model); the first version answers one question at a time.</text>
<rect x="40" y="96" width="920" height="850" rx="14" fill="#ffffff" stroke="#d8d2e6" stroke-width="1"/>
