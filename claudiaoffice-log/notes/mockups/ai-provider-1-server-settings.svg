<polygon points="70.0,251.5 71.8,258.2 78.5,260.0 71.8,261.8 70.0,268.5 68.2,261.8 61.5,260.0 68.2,258.2" fill="#f7f3ec"/>
<text x="86" y="303" font-size="13.5" font-weight="400" fill="#cfc9e3" text-anchor="start">Typesetting</text>
<text x="86" y="341" font-size="13.5" font-weight="400" fill="#cfc9e3" text-anchor="start">Access &amp; documents</text>
<text x="150" y="912" font-size="12.5" font-weight="400" fill="#a9a3bd" text-anchor="middle">Sign out</text>
<text x="300" y="186" font-size="23" font-weight="500" fill="#1f1a33" text-anchor="start" font-family="Fraunces, Georgia, serif">AI</text>
<text x="300" y="210" font-size="13.5" font-weight="400" fill="#6e6880" text-anchor="start">What answers @ai in every document on this server.</text>
<rect x="300" y="230" width="640" height="44" rx="10" fill="#e7e1f4"/>
<circle cx="320" cy="252" r="5" fill="#5b4bc4"/>
<text x="334" y="257" font-size="12.5" font-weight="400" fill="#6e6880" text-anchor="start">Answering now:</text>
<text x="440" y="257" font-size="13" font-weight="600" fill="#1f1a33" text-anchor="start">Claude · claude-sonnet-5-5</text>
